<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OC Social Network</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --purple: #a993d9;
  --purple-dark: #8066b5;
  --purple-light: #eee8fa;
  --pink: #f3d7e8;
  --blue: #4d8fdc;
  --bg: #f7f5f9;
  --border: #dedbe3;
  --text: #26232a;
  --muted: #77727c;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

/* HEADER */

.topbar {
  height: 64px;
  background: white;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 25px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  color: var(--purple-dark);
  font-size: 21px;
  font-weight: 800;
}

.topbar-user {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 700;
}

.ocx-unread-badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:#40a0b8;color:#fff;font-size:10px;font-weight:900;line-height:18px;text-align:center;box-sizing:border-box;border:2px solid #fff;pointer-events:none;z-index:3}

.ocx-profile-messages{margin-top:18px;padding:14px;border:1px solid #e5ddea;border-radius:14px;background:#faf8fc}
.ocx-profile-messages-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.ocx-profile-messages-title{font-weight:900;color:#a6285a}
.ocx-profile-messages-count{background:#40a0b8;color:#fff;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:900}
.ocx-profile-message-list{display:grid;gap:8px}
.ocx-profile-message-item{width:100%;display:flex;align-items:center;gap:10px;padding:9px;border:1px solid #e8e0ed;border-radius:12px;background:#fff;text-align:left;cursor:pointer}
.ocx-profile-message-item:hover{background:#f7f3fa}
.ocx-profile-message-item .avatar{width:38px;height:38px;min-width:38px}
.ocx-profile-message-copy{min-width:0;flex:1}
.ocx-profile-message-sender{font-weight:800;font-size:12px}
.ocx-profile-message-preview{font-size:11px;color:#77727c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ocx-profile-message-time{font-size:10px;color:#aaa5ad;white-space:nowrap}
.avatar.ocx-has-unread{position:relative;overflow:visible}

/* LAYOUT */

.app {
  max-width: 1450px;
  margin: 0 auto;
  padding: 25px;
  display: grid;
  grid-template-columns: minmax(680px, 1fr) 340px;
  gap: 25px;
  align-items: start;
}

/* MAIN FEED + RIGHT-SIDE WIDGETS */
.feed{grid-column:1;grid-row:1;min-width:0}
.right-column{grid-column:2;grid-row:1;min-width:0}
.left-column{grid-column:2;grid-row:2;min-width:0}
.post{font-size:15px}
.post-image,.placeholder-image{height:540px}

/* PANELS */

.panel {
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 18px;
}

.panel-title {
  color: var(--purple-dark);
  font-weight: 800;
  font-size: 14px;
  padding-bottom: 11px;
  margin-bottom: 13px;
  border-bottom: 1px solid #eee;
}

/* AVATARS */

.avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--purple);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
  font-weight: 800;
}

.avatar.large {
  width: 72px;
  height: 72px;
  font-size: 23px;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* INPUTS */

input,
textarea,
select {
  width: 100%;
  border: 1px solid #d8d4dc;
  background: #fff;
  border-radius: 7px;
  padding: 10px;
  font: inherit;
  outline: none;
}

input:focus,
textarea:focus,
select:focus {
  border-color: var(--purple);
  box-shadow: 0 0 0 2px rgba(169,147,217,.15);
}

textarea {
  min-height: 90px;
  resize: vertical;
}

label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  margin: 10px 0 5px;
}

/* BUTTONS */

button {
  font: inherit;
}

.btn {
  border: none;
  border-radius: 7px;
  padding: 9px 12px;
  cursor: pointer;
  font-weight: 700;
}

.btn-purple {
  background: var(--purple);
  color: white;
}

.btn-purple:hover {
  background: var(--purple-dark);
}

.btn-light {
  background: var(--purple-light);
  color: var(--purple-dark);
}

.btn-danger {
  background: #f5dddd;
  color: #a64040;
}

.btn-full {
  width: 100%;
  margin-top: 9px;
}

/* PROFILE MINI */

.profile-mini {
  display: flex;
  align-items: center;
  gap: 10px;
}

.profile-name {
  font-weight: 800;
  font-size: 14px;
}

.profile-handle {
  color: var(--muted);
  font-size: 12px;
  margin-top: 2px;
}

/* DMS */

.dm-list {
  height: 280px;
  overflow-y: auto;
  background: #faf9fb;
  border: 1px solid #eee;
  border-radius: 8px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.message {
  max-width: 82%;
  padding: 8px 11px;
  border-radius: 14px;
  font-size: 13px;
  line-height: 1.35;
}

.message.them {
  align-self: flex-start;
  background: #eceaed;
  border-bottom-left-radius: 3px;
}

.message.me {
  align-self: flex-end;
  background: var(--purple);
  color: white;
  border-bottom-right-radius: 3px;
}

.dm-compose {
  display: flex;
  gap: 5px;
  margin-top: 9px;
}

.dm-compose input {
  min-width: 0;
}

/* FEED */

.feed {
  min-width: 0;
}

.story-bar {
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 13px;
  margin-bottom: 18px;
  display: flex;
  gap: 15px;
  overflow-x: auto;
}

.story {
  min-width: 65px;
  text-align: center;
  font-size: 11px;
  color: var(--muted);
}

.story .avatar {
  margin: auto auto 5px;
  border: 3px solid #e7c8e5;
}

.post {
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 20px;
}

.post-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 14px;
}

.post-user {
  display: flex;
  align-items: center;
  gap: 9px;
}

.post-user-name {
  font-weight: 800;
  font-size: 14px;
}

.post-user-handle {
  color: var(--muted);
  font-size: 11px;
}

.post-menu {
  border: none;
  background: none;
  font-size: 20px;
  cursor: pointer;
}

.post-image {
  width: 100%;
  height: 420px;
  object-fit: cover;
  background: var(--purple-light);
  display: block;
}

.placeholder-image {
  width: 100%;
  height: 420px;
  background: linear-gradient(135deg, #e6def6, #f4dce8);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--purple-dark);
  font-size: 48px;
  font-weight: 900;
}

.post-actions {
  display: flex;
  gap: 17px;
  padding: 11px 14px 4px;
}

.icon-btn {
  border: none;
  background: none;
  cursor: pointer;
  padding: 0;
  font-size: 22px;
}

.like-button.liked {
  color: #df4771;
}

.post-body {
  padding: 4px 14px 15px;
}

.likes {
  font-weight: 800;
  font-size: 13px;
  margin-bottom: 7px;
}

.caption {
  font-size: 14px;
  line-height: 1.45;
}

.caption strong {
  margin-right: 5px;
}

.view-comments {
  border: none;
  background: none;
  color: #8b858f;
  padding: 8px 0 0;
  cursor: pointer;
  font-size: 13px;
}

.post-date {
  color: #aaa5ad;
  font-size: 10px;
  margin-top: 8px;
}

/* RIGHT SIDE */

.editor-section {
  border-top: 1px solid #eee;
  margin-top: 15px;
  padding-top: 15px;
}

.small-note {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.4;
}

/* MODAL */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(25, 20, 30, .55);
  z-index: 20000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.open {
  display: flex;
}

.modal-box {
  background: white;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
  border-radius: 14px;
  box-shadow: 0 15px 50px rgba(0,0,0,.25);
}

.modal-header {
  padding: 16px 18px;
  border-bottom: 1px solid #eee;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-title {
  color: var(--purple-dark);
  font-weight: 800;
}

.close {
  border: none;
  background: none;
  cursor: pointer;
  font-size: 23px;
  color: #888;
}

.modal-content {
  padding: 18px;
}

/* COMMENTS */

.comment-list {
  max-height: 330px;
  overflow-y: auto;
  margin-bottom: 14px;
}

.comment {
  padding: 10px 0;
  border-bottom: 1px solid #eee;
}

.comment strong {
  font-size: 13px;
}

.comment-text {
  font-size: 13px;
  margin-top: 3px;
  line-height: 1.4;
}

.comment-actions {
  margin-top: 5px;
  display: flex;
  gap: 10px;
}

.comment-actions button {
  border: none;
  background: none;
  padding: 0;
  color: #888;
  cursor: pointer;
  font-size: 11px;
}

/* PROFILE */

.profile-edit-top {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-bottom: 15px;
}

/* FILE INPUT */

.file-input {
  font-size: 12px;
  padding: 7px;
}

/* MOBILE */

@media (max-width: 1050px) {
  .app {
    grid-template-columns: minmax(0, 1fr) 280px;
  }
  .feed{grid-column:1;grid-row:1 / span 2}
  .right-column{grid-column:2;grid-row:1}
  .left-column{grid-column:2;grid-row:2}
  .post-image,.placeholder-image{height:470px}
}

@media (max-width: 750px) {
  .topbar {
    padding: 0 14px;
  }

  .app {
    display: block;
    padding: 12px;
  }
  .feed,.left-column,.right-column{grid-column:auto;grid-row:auto}

  .left-column,
  .right-column {
    margin-bottom: 15px;
  }

  .right-column {
    display: block;
  }

  .post-image,
  .placeholder-image {
    height: 330px;
  }

  .left-column {
    display: none;
  }
}
</style>

</head>

<body>

<header class="topbar">
  <div class="logo">✦ OC Social</div>

  <div class="ocx-search-wrap">

      <button type="button" class="ocx-profile-stat ocx-profile-stat-btn" id="ocxFollowingStat" onclick="OCX.showConnections('following')" title="View following"><strong id="ocxProfileFollowing">0</strong><span>Following</span></button>

            Editing the currently selected OC.
          </div>
        </div>

      </div>


      <label>Display name</label>

      <input id="editName">


      <label>Username</label>

      <input id="editUsername">


      <label>Bio</label>

      <textarea id="editBio"></textarea>

        class="file-input"
        type="file"
        accept="image/*"
        onchange="loadAvatar(event)"
      >


      <button
        class="btn btn-purple btn-full"
        onclick="saveProfile()"
      >
        💾 Save Profile
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   DATA
========================================================= */

const defaultCharacters = {
  Barista_Arin: {
    name: "Arin",
    username: "Barista_Arin",
    bio: "☕ Professional barista. Amateur chaos enthusiast.",
    avatar: "",
    color: "#A993D9"
  },

  Coffee_Shop_Hero: {
    name: "Coffee Shop Hero",
    username: "Coffee_Shop_Hero",
    bio: "⚔️ Somehow always ends up in an adventure.",
    avatar: "",
    color: "#C28D72"
  },

  Grumpy_Regular: {
    name: "The Grumpy Regular",
    username: "Grumpy_Regular",
    bio: "📖 I came here for coffee. Please leave me alone.",
    avatar: "",
    color: "#75859A"
  },

  Chai_Enthusiast: {
    name: "Chai Enthusiast",
    username: "Chai_Enthusiast",
    bio: "✨ Chai solves approximately 72% of life's problems.",
    avatar: "",
    color: "#D9A05C"
  }
};


const defaultDMs = {
  Coffee_Shop_Hero: [
    { from: "them", text: "You working tonight?" },
    { from: "me", text: "Unfortunately." },
    { from: "them", text: "Perfect. I need caffeine." }
  ],

  Barista_Arin: [
    { from: "them", text: "Your usual is ready." }
  ],

  Grumpy_Regular: [
    { from: "them", text: "Someone moved my chair." },
    { from: "me", text: "Tragic." }
  ],

  Chai_Enthusiast: [
    { from: "them", text: "I found a new chai place!!" }
  ]
};


const defaultPost = {
  author: "Barista_Arin",
  caption: "Another completely normal day at the coffee shop ☕✨",
  likes: 32,
  image: "",
  comments: [
    {
      author: "Coffee_Shop_Hero",
      text: "This place looks suspiciously peaceful.",
      likes: 4
    },
    {
      author: "Chai_Enthusiast",
      text: "WAIT IS THAT MY CUP??",
      likes: 8
    },
    {
      author: "Grumpy_Regular",
      text: "Too bright.",
      likes: 2
    }
  ]
};


/* =========================================================
   LOAD / SAVE
========================================================= */

function loadData() {

  let savedCharacters =
    localStorage.getItem("ocCharacters");

  let savedDMs =
    localStorage.getItem("ocDMs");

  let savedDMs2 =
    localStorage.getItem("ocDMs2");

  let savedPost =
    localStorage.getItem("ocPost");

  return {
    characters: savedCharacters
      ? JSON.parse(savedCharacters)
      : structuredClone(defaultCharacters),

    dms: savedDMs
      ? JSON.parse(savedDMs)
      : structuredClone(defaultDMs),

    dms2: savedDMs2
      ? JSON.parse(savedDMs2)
      : {},

    post: savedPost
      ? JSON.parse(savedPost)
      : structuredClone(defaultPost)
  };
}


let data = loadData();

let activeActor =
  localStorage.getItem("activeActor") || "Barista_Arin";

let currentDM =
  localStorage.getItem("currentDM") || "Coffee_Shop_Hero";


function saveAll() {

  localStorage.setItem(
    "ocCharacters",
    JSON.stringify(data.characters)
  );

  localStorage.setItem(
    "ocDMs",
    JSON.stringify(data.dms)
  );

  // Extended 1-to-1 DMs (including edits/deletions) must be persisted too.
  localStorage.setItem(
    "ocDMs2",
    JSON.stringify(data.dms2 || {})
  );

  localStorage.setItem(
    "ocPost",
    JSON.stringify(data.post)
  );

  localStorage.setItem(
    "activeActor",
    activeActor
  );

  localStorage.setItem(
    "currentDM",
    currentDM
  );
}


/* =========================================================
   INITIALIZATION
========================================================= */

function init() {

  populateActorSelects();
  renderEverything();

}


function populateActorSelects() {

  const actorSelect =
    document.getElementById("actorSelect");

  const dmRecipient =
    document.getElementById("dmRecipient");

  const postAuthor =
    document.getElementById("postAuthor");


  actorSelect.innerHTML = "";
  dmRecipient.innerHTML = "";
  if(postAuthor) postAuthor.innerHTML = "";


  Object.keys(data.characters).forEach(key => {

    const character =
      data.characters[key];


    const option1 =
      document.createElement("option");

    option1.value = key;
    option1.textContent =
      "@" + character.username;

    actorSelect.appendChild(option1);


    const option2 =
      document.createElement("option");

    option2.value = key;
    option2.textContent =
      "@" + character.username;

    dmRecipient.appendChild(option2);


    const option3 =
      document.createElement("option");

    option3.value = key;
    option3.textContent =
      character.name + " (@" + character.username + ")";

    if(postAuthor) postAuthor.appendChild(option3);

  });


  actorSelect.value = activeActor;
  dmRecipient.value = currentDM;
  if(postAuthor) postAuthor.value = data.post.author;
}


/* =========================================================
   RENDER EVERYTHING
========================================================= */

function renderEverything() {

  renderAccount();
  renderStories();
  renderFeed();
  renderDM();
  renderPostEditor();

}


/* =========================================================
   ACCOUNT
========================================================= */

function renderAccount() {

  const character =
    data.characters[activeActor];


  document.getElementById("topbar-name").textContent =
    "@" + character.username;


  setAvatar(
    document.getElementById("topbar-avatar"),
    character
  );


  setAvatar(
    document.getElementById("leftAvatar"),
    character
  );
  updateUnreadBadge(document.getElementById("topbar-avatar"), character);
  updateUnreadBadge(document.getElementById("leftAvatar"), character);


  document.getElementById("leftName").textContent =
    character.name;


  document.getElementById("leftHandle").textContent =
    "@" + character.username;


  document.getElementById("actorSelect").value =
    activeActor;

}


function setAvatar(element, character) {

  element.innerHTML = "";

  element.style.background =
    character.color || "#A993D9";


  if (character.avatar) {

    const img =
      document.createElement("img");

    img.src = character.avatar;

    element.appendChild(img);

  } else {

    element.textContent =
      character.name.charAt(0).toUpperCase();

  }

}


/* =========================================================
   STORIES
========================================================= */

function renderStories() {

  const bar =
    document.getElementById("storyBar");

  bar.innerHTML = "";


  Object.keys(data.characters).forEach(key => {

    const character =
      data.characters[key];


    const story =
      document.createElement("div");

    story.className = "story";


    const avatar =
      document.createElement("div");

    avatar.className = "avatar";


    setAvatar(avatar, character);


    const name =
      document.createElement("div");

    name.textContent =
      character.username;


    story.appendChild(avatar);
    story.appendChild(name);

    bar.appendChild(story);

  });

}


/* =========================================================
   FEED
========================================================= */

function renderFeed() {

  const feed =
    document.getElementById("feed");

  feed.innerHTML = "";


  const post =
    data.post;


  const author =
    data.characters[post.author];


  const article =
    document.createElement("article");

  article.className = "post";


  /* HEADER */

  const header =
    document.createElement("div");

  header.className = "post-header";


  const user =
    document.createElement("div");

  user.className = "post-user";


  const avatar =
    document.createElement("div");

  avatar.className = "avatar";

  setAvatar(avatar, author);


  const userText =
    document.createElement("div");


  const name =
    document.createElement("div");

  name.className = "post-user-name";

  name.textContent =
    author.name;


  const handle =
    document.createElement("div");

  handle.className = "post-user-handle";

  handle.textContent =
    "@" + author.username;


  userText.appendChild(name);
  userText.appendChild(handle);

  user.appendChild(avatar);
  user.appendChild(userText);


  const menu =
    document.createElement("button");

  menu.className = "post-menu";

  menu.textContent = "•••";

  menu.onclick = () =>
    openPostEditor();


  header.appendChild(user);
  header.appendChild(menu);


  /* IMAGE */

  let imageElement;


  if (post.image) {

    imageElement =
      document.createElement("img");

    imageElement.className =
      "post-image";

    imageElement.src =
      post.image;

  } else {

    imageElement =
      document.createElement("div");

    imageElement.className =
      "placeholder-image";

    imageElement.textContent = "✦";

  }


  /* ACTIONS */

  const actions =
    document.createElement("div");

  actions.className =
    "post-actions";


  const likeButton =
    document.createElement("button");

  likeButton.className =
    "icon-btn like-button";


  likeButton.textContent =
    "♡";


  likeButton.onclick = function() {

    post.likes++;

    this.textContent = "♥";

    this.classList.add("liked");

    saveAll();
    renderFeed();
    renderPostEditor();

  };


  const commentButton =
    document.createElement("button");

  commentButton.className =
    "icon-btn";

  commentButton.textContent =
    "💬";

  commentButton.onclick =
    openComments;


  const editButton =
    document.createElement("button");

  editButton.className =
    "icon-btn";

  editButton.textContent =
    "✏️";

  editButton.onclick =
    openPostEditor;


  actions.appendChild(likeButton);
  actions.appendChild(commentButton);
  actions.appendChild(editButton);


  /* BODY */

  const body =
    document.createElement("div");

  body.className =
    "post-body";


  const likes =
    document.createElement("div");

  likes.className =
    "likes";

  likes.textContent =
    post.likes + " likes";


  const caption =
    document.createElement("div");

  caption.className =
    "caption";


  const strong =
    document.createElement("strong");

  strong.textContent =
    author.username;


  caption.appendChild(strong);

  caption.appendChild(
    document.createTextNode(
      " " + post.caption
    )
  );


  const commentsButton =
    document.createElement("button");

  commentsButton.className =
    "view-comments";

  commentsButton.textContent =
    "View all " +
    post.comments.length +
    " comments";

  commentsButton.onclick =
    openComments;


  const date =
    document.createElement("div");

  date.className =
    "post-date";

  date.textContent =
    "OC SOCIAL NETWORK";


  body.appendChild(likes);
  body.appendChild(caption);
  body.appendChild(commentsButton);
  body.appendChild(date);


  article.appendChild(header);
  article.appendChild(imageElement);
  article.appendChild(actions);
  article.appendChild(body);


  feed.appendChild(article);

}


/* =========================================================
   POST EDITOR
========================================================= */

function renderPostEditor() {

  document.getElementById("postCaption").value =
    data.post.caption;

  document.getElementById("postLikes").value =
    data.post.likes;

  if(document.getElementById("postAuthor")) document.getElementById("postAuthor").value =
    data.post.author;

}


function openPostEditor() {

  document.getElementById("postCaption").value =
    data.post.caption;

  document.getElementById("postLikes").value =
    data.post.likes;

  if(document.getElementById("postAuthor")) document.getElementById("postAuthor").value =
    data.post.author;

  document.getElementById("postCaption")
    .focus();

}


function savePost() {

  data.post.caption =
    document.getElementById("postCaption").value;

  data.post.likes =
    Math.max(
      0,
      Number(
        document.getElementById("postLikes").value
      ) || 0
    );

  data.post.author =
    document.getElementById("postAuthor").value;


  saveAll();

  renderFeed();

  alert("Post saved!");

}


function loadPostImage(event) {

  const file =
    event.target.files[0];

  if (!file) return;


  const reader =
    new FileReader();


  reader.onload = function(e) {

    data.post.image =
      e.target.result;

    saveAll();

    renderFeed();

  };


  reader.readAsDataURL(file);

}


function resetPost() {

  if (!confirm("Reset the post to its original state?"))
    return;


  data.post =
    structuredClone(defaultPost);

  saveAll();

  renderFeed();
  renderPostEditor();

}


/* =========================================================
   COMMENTS
========================================================= */

function openComments() {

  renderComments();

  openModal("commentsModal");

}


function renderComments() {

  const list =
    document.getElementById("commentList");

  list.innerHTML = "";


  if (data.post.comments.length === 0) {

    list.innerHTML =
      "<p style='color:#888;font-size:13px;'>No comments yet.</p>";

    return;

  }


  data.post.comments.forEach(
    (comment, index) => {

      const author =
        data.characters[comment.author];


      const item =
        document.createElement("div");

      item.className =
        "comment";


      const strong =
        document.createElement("strong");

      strong.textContent =
        author
          ? "@" + author.username
          : "Unknown";


      const text =
        document.createElement("div");

      text.className =
        "comment-text";

      text.textContent =
        comment.text;


      const actions =
        document.createElement("div");

      actions.className =
        "comment-actions";


      const deleteButton =
        document.createElement("button");

      deleteButton.textContent =
        "Delete";


      deleteButton.onclick =
        function() {

          data.post.comments.splice(
            index,
            1
          );

          saveAll();

          renderComments();
          renderFeed();

        };


      const editButton =
        document.createElement("button");

      editButton.textContent =
        "Edit";


      editButton.onclick =
        function() {

          const replacement =
            prompt(
              "Edit comment:",
              comment.text
            );


          if (
            replacement !== null &&
            replacement.trim()
          ) {

            comment.text =
              replacement.trim();

            saveAll();

            renderComments();
            renderFeed();

          }

        };


      actions.appendChild(editButton);
      actions.appendChild(deleteButton);


      item.appendChild(strong);
      item.appendChild(text);
      item.appendChild(actions);


      list.appendChild(item);

    }
  );

}


function addComment() {

  const input =
    document.getElementById("commentInput");


  const text =
    input.value.trim();


  if (!text)
    return;


  data.post.comments.push({

    author: activeActor,

    text: text,

    likes: 0

  });


  input.value = "";


  saveAll();

  renderComments();
  renderFeed();

}


/* =========================================================
   DMS
========================================================= */

function changeDM() {

  currentDM =
    document.getElementById("dmRecipient").value;


  saveAll();

  renderDM();

}


function renderDM() {

  const list =
    document.getElementById("dmList");


  list.innerHTML = "";


  const messages =
    data.dms[currentDM] || [];


  messages.forEach(message => {

    const bubble =
      document.createElement("div");


    bubble.className =
      "message " +
      (
        message.from === "me"
          ? "me"
          : "them"
      );


    bubble.textContent =
      message.text;


    list.appendChild(bubble);

  });


  list.scrollTop =
    list.scrollHeight;

}


function sendDM() {

  const input =
    document.getElementById("dmInput");


  const text =
    input.value.trim();


  if (!text)
    return;


  if (!data.dms[currentDM])
    data.dms[currentDM] = [];


  data.dms[currentDM].push({

    from: "me",

    text: text

  });


  input.value = "";


  saveAll();

  renderDM();

}


/* =========================================================
   ACTOR SWITCHING
========================================================= */

function changeActor() {

  activeActor =
    document.getElementById("actorSelect").value;


  saveAll();

  renderEverything();

}


/* =========================================================
   PROFILE EDITOR
========================================================= */

function openProfileModal() {

  const character =
    data.characters[activeActor];


  document.getElementById("editName").value =
    character.name;


  document.getElementById("editUsername").value =
    character.username;


  document.getElementById("editBio").value =
    character.bio;


  document.getElementById("editProfileHandle").textContent =
    "@" + character.username;


  setAvatar(
    document.getElementById("editAvatar"),
    character
  );


  openModal("profileModal");

}


function loadAvatar(event) {
  const file = event.target.files[0];
  if (!file) return;
  openCropper(file, function(cropped){
    data.characters[activeActor].avatar = cropped;
    setAvatar(document.getElementById("editAvatar"), data.characters[activeActor]);
    event.target.value = "";
  });
}


function saveProfile() {

  const character =
    data.characters[activeActor];


  character.name =
    document.getElementById("editName").value.trim()
    || character.name;


  character.username =
    document.getElementById("editUsername").value.trim()
    || character.username;


  character.bio =
    document.getElementById("editBio").value.trim();


  saveAll();

  populateActorSelects();

  renderEverything();

  closeModal("profileModal");

}


/* =========================================================
   MODALS
========================================================= */

function openModal(id) {

  document
    .getElementById(id)
    .classList.add("open");

}


function closeModal(id) {

  document
    .getElementById(id)
    .classList.remove("open");

}


/* Close when clicking outside modal */

document.addEventListener(
  "click",
  function(event) {

    if (
      event.target.classList.contains("modal")
    ) {

      event.target.classList.remove("open");

    }

  }
);


/* =========================================================
   START
========================================================= */

init();


</script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script id="oc-extension-script">
(function(){
  "use strict";

  /* ---------------------------------------------------------
     CLOUD CONFIG
     Create a Firebase project, enable Email/Password Auth and
     Firestore, then paste your web-app config below.
     Until configured, the site continues using localStorage.
     --------------------------------------------------------- */
  const OC_FIREBASE_CONFIG = {
    apiKey: "AIzaSyAt90JkX0O3gjTreRE2okrwYVJYv25kkyw",
    authDomain: "oc-social-media.firebaseapp.com",
    projectId: "oc-social-media",
    storageBucket: "oc-social-media.firebasestorage.app",
    messagingSenderId: "143069054681",
    appId: "1:143069054681:web:7f93c8bade14fe91c120c8"
  };

  let cloud = { enabled:false, user:null, db:null, auth:null, unsub:null };
  let cloudSaveTimer = null;
  let localCloudDirty = false;
  let cloudSyncReady = false;
  let cloudSyncInProgress = false;
  let selectedPostId = null;

  const clone = x => JSON.parse(JSON.stringify(x));
  const keyPair = (a,b) => [a,b].sort().join("__");
  const safe = x => String(x ?? "").trim();
  function formatTimestamp(ts){
    const n=Number(ts);
    if(!Number.isFinite(n)) return "";
    const d=new Date(n);
    if(Number.isNaN(d.getTime())) return "";
    return d.toLocaleString([], {month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"});
  }

  function toDateTimeLocal(ts){
    const d=new Date(Number(ts)||Date.now());
    const pad=n=>String(n).padStart(2,"0");
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function timestampFromInput(value,fallback){
    const n=value ? new Date(value).getTime() : NaN;
    return Number.isFinite(n) ? n : (Number(fallback)||Date.now());
  }

  function cloudConfigured(){
    return OC_FIREBASE_CONFIG.apiKey &&
      !OC_FIREBASE_CONFIG.apiKey.startsWith("PASTE_") &&
      OC_FIREBASE_CONFIG.projectId &&
      !OC_FIREBASE_CONFIG.projectId.startsWith("PASTE_");
  }

  /* New normalized data lives alongside the original data object. */
  function ensureExtendedData(){
    if(!Array.isArray(data.posts)){
      data.posts = [{
        id:"post_"+Date.now(),
        author:data.post.author,
        caption:data.post.caption,
        likes:Number(data.post.likes)||0,
        image:data.post.image||"",
        comments:(data.post.comments||[]).map((c,i)=>({
          id:"comment_"+i+"_"+Date.now(),
          author:c.author,text:c.text,likes:c.likes||0,replies:c.replies||[]
        })),
        createdAt:Date.now()
      }];
    }
    if(!data.dms2) data.dms2 = {};
    if(!data.settings) data.settings = {};
    if(!data.posts.length){
      data.posts.push({
        id:"post_"+Date.now(),author:activeActor,caption:"",likes:0,image:"",
        comments:[],createdAt:Date.now()
      });
    }
    const now=Date.now();
    data.posts.forEach((post,pi)=>{
      if(!post.createdAt) post.createdAt=now-(data.posts.length-1-pi)*60000;
      if(!Array.isArray(post.comments)) post.comments=[];
      post.comments.forEach((c,ci)=>{
        if(!c.id) c.id="comment_"+ci+"_"+Date.now();
        if(!c.createdAt) c.createdAt=post.createdAt || now;
        if(!Array.isArray(c.replies)) c.replies=[];
        c.replies.forEach((r,ri)=>{
          if(!r.id) r.id="reply_"+ri+"_"+Date.now();
          if(!r.createdAt) r.createdAt=c.createdAt || now;
        });
      });
    });
    Object.keys(data.dms2||{}).forEach(k=>{
      (data.dms2[k]||[]).forEach((m,i)=>{
        if(!m.id) m.id="msg_"+Date.now()+"_"+i;
        if(!m.createdAt) m.createdAt=now-(data.dms2[k].length-1-i)*60000;
        if(!Array.isArray(m.readBy)) m.readBy = m.from ? [m.from] : [];
      });
    });
    syncLegacyPost();
  }

  function syncLegacyPost(){
    const first = data.posts[0];
    if(first){
      data.post = {
        author:first.author,caption:first.caption,likes:first.likes,
        image:first.image,comments:first.comments
      };
    }
  }

  function renderTopLikedPosts(){
    const list=document.getElementById("ocxTopLikedList");
    if(!list) return;
    const entries=(Array.isArray(data.posts)?data.posts:[])
      .filter(p=>p && p.id)
      .map(p=>({post:p,likes:Number(p.likes)||0}))
      .sort((a,b)=>b.likes-a.likes || Number(b.post.createdAt||0)-Number(a.post.createdAt||0))
      .slice(0,3);
    list.innerHTML="";
    if(!entries.length){list.innerHTML='<div class="ocx-empty">No posts yet.</div>';return;}
    entries.forEach(({post,likes},i)=>{
      const author=data.characters[post.author]||{};
      const row=document.createElement("button");
      row.type="button";
      row.className="ocx-top-liked-row";
      row.innerHTML=`<div class="ocx-top-liked-rank">${i+1}</div><div class="ocx-top-liked-info"><div class="ocx-top-liked-author">${escapeHtml(author.name||author.username||"Unknown")}</div><div class="ocx-top-liked-caption">${escapeHtml(post.caption||"Photo post")}</div></div><div class="ocx-top-liked-count">${formatCount(likes)} ❤️</div>`;
      row.onclick=()=>openProfilePost(post.id);
      list.appendChild(row);
    });
  }

  function renderTopFollowers(){
    const list=document.getElementById("ocxTopFollowersList");
    if(!list) return;
    const entries=Object.keys(data.characters||{}).map(k=>{
      const c=data.characters[k];
      ensureProfileFields(c);
      return {key:k,character:c,followers:Number(c.followers)||0};
    }).sort((a,b)=>b.followers-a.followers || String(a.character.name||a.key).localeCompare(String(b.character.name||b.key))).slice(0,5);
    list.innerHTML="";
    if(!entries.length){list.innerHTML='<div class="ocx-empty">No profiles yet.</div>';return;}
    entries.forEach(({key,character,followers})=>{
      const row=document.createElement("button");
      row.type="button";
      row.className="ocx-top-follower-row";
      const av=document.createElement("div");
      av.className="avatar";
      setAvatar(av,character);
      const info=document.createElement("div");
      info.className="ocx-top-follower-info";
      info.innerHTML=`<div class="ocx-top-follower-name">${escapeHtml(character.name||key)}</div><div class="ocx-top-follower-handle">@${escapeHtml(character.username||key)}</div>`;
      const count=document.createElement("div");
      count.className="ocx-top-follower-count";
      count.textContent=Number(followers).toLocaleString()+" followers";
      row.append(av,info,count);
      row.onclick=()=>openCharacterProfile(key);
      list.appendChild(row);
    });
  }

  /* ---------- Dynamic UI additions ---------- */
  function addExtensionUI(){
    if(!document.getElementById("ocxImageLightbox")){
      const lb=document.createElement("div");
      lb.id="ocxImageLightbox";lb.className="ocx-image-lightbox";
      lb.innerHTML='<button type="button" class="ocx-image-lightbox-close" aria-label="Close image">×</button><img id="ocxLightboxImage" alt="Expanded post photo">';
      document.body.appendChild(lb);
      lb.querySelector(".ocx-image-lightbox-close").onclick=closeImageLightbox;
      lb.addEventListener("click",e=>{if(e.target===lb)closeImageLightbox();});
    }
    const right = document.querySelector(".right-column .panel");
    if(!right || document.getElementById("ocxTools")) return;

    const topFollowers = document.createElement("div");
    topFollowers.id="ocxTopFollowers";
    topFollowers.className="panel";
    topFollowers.innerHTML=`<div class="panel-title">👑 Most Followed</div><div class="ocx-top-followers-list" id="ocxTopFollowersList"></div>`;
    right.parentNode.insertBefore(topFollowers, right);
    renderTopFollowers();

    const topLiked = document.createElement("div");
    topLiked.id="ocxTopLiked";
    topLiked.className="panel";
    topLiked.innerHTML=`<div class="panel-title">❤️ Top 3 Most Liked Posts</div><div class="ocx-top-liked-list" id="ocxTopLikedList"></div>`;
    topFollowers.insertAdjacentElement("afterend", topLiked);
    renderTopLikedPosts();

    const tools = document.createElement("div");
    tools.id="ocxTools";
    tools.className="editor-section";
    tools.innerHTML=`
      <div class="panel-title">✦ OC Studio</div>
      <div class="ocx-toolbar">
        <button class="btn btn-purple" onclick="OCX.openCharacterCreator()">＋ Character</button>
        <button class="btn btn-light" onclick="OCX.openPostCreator()">＋ Post</button>
      </div>
      <div class="ocx-toolbar">
        <button class="btn btn-light" onclick="OCX.openPostManager()">🗂 Posts</button>
        <button class="btn btn-light" onclick="OCX.openCloud()">☁ Cloud</button>
      </div>
      <p class="small-note">Characters, posts, replies and private conversations are kept in your current data store. Cloud mode makes the same account available on other devices.</p>
    `;
    right.appendChild(tools);

    const left = document.querySelector(".left-column");
    if(left && !document.getElementById("ocxCloudStatus")){
      const panel=document.createElement("div");
      panel.className="panel ocx-auth";
      panel.id="ocxCloudStatus";
      panel.innerHTML=`
        <div class="panel-title">☁ Account Sync</div>
        <div id="ocxCloudText">Local mode</div>
        <div class="ocx-cloud">Cloud mode is optional. Sign in with the same account on another device to load the same OCs, posts and DMs.</div>
        <button class="btn btn-light btn-full" onclick="OCX.openCloud()">Cloud settings</button>
      `;
      left.appendChild(panel);
    }
  }

  function modal(id,title,content,wide){
    let m=document.getElementById(id);
    if(m) m.remove();
    m=document.createElement("div");
    m.className="modal";
    m.id=id;
    m.innerHTML=`<div class="modal-box ${wide?"ocx-modal-wide":""}">
      <div class="modal-header"><div class="modal-title">${title}</div><button class="close" onclick="OCX.close('${id}')">×</button></div>
      <div class="modal-content">${content}</div>
    </div>`;
    document.body.appendChild(m);
    openModal(id);
    return m;
  }

  function openImageLightbox(src){
    const lb=document.getElementById("ocxImageLightbox");
    const img=document.getElementById("ocxLightboxImage");
    if(!lb||!img||!src)return;
    img.src=src;
    lb.classList.add("show");
    document.body.style.overflow="hidden";
  }

  function closeImageLightbox(){
    const lb=document.getElementById("ocxImageLightbox");
    const img=document.getElementById("ocxLightboxImage");
    if(lb)lb.classList.remove("show");
    if(img)img.removeAttribute("src");
    document.body.style.overflow="";
  }

  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeImageLightbox();});

  /* ---------- Character creation ---------- */
  function openCharacterCreator(){
    modal("ocxCharacterModal","✦ Create Character",`
      <label>Display name</label><input id="ocxNewName" placeholder="Your OC's name">
      <label>Username</label><input id="ocxNewUsername" placeholder="Unique username">
      <label>Bio</label><textarea id="ocxNewBio" placeholder="A short bio..."></textarea>
      <label>Accent color</label><input id="ocxNewColor" type="color" value="#A993D9" style="height:42px;padding:4px">
      <button class="btn btn-purple btn-full" onclick="OCX.createCharacter()">Create Character</button>
    `);
  }

  function createCharacter(){
    const name=safe(document.getElementById("ocxNewName").value);
    let username=safe(document.getElementById("ocxNewUsername").value).replace(/^@/,"").replace(/\s+/g,"_");
    if(!name || !username){ alert("Please add a name and username."); return; }
    const exists=Object.keys(data.characters).some(k=>data.characters[k].username.toLowerCase()===username.toLowerCase());
    if(exists){ alert("That username is already in use."); return; }
    const id=username.replace(/[^\w-]/g,"_")+"_"+Date.now();
    data.characters[id]={name,username,bio:safe(document.getElementById("ocxNewBio").value),avatar:"",color:document.getElementById("ocxNewColor").value};
    activeActor=id;
    currentDM=Object.keys(data.characters).find(k=>k!==id) || id;
    if(!data.dms2[keyPair(id,currentDM)]) data.dms2[keyPair(id,currentDM)]=[];
    saveExtended();
    populateActorSelects();
    renderEverything();
    closeModal("ocxCharacterModal");
  }

  /* ---------- Multiple posts ---------- */
  function openPostCreator(editId){
    const p=editId ? data.posts.find(x=>x.id===editId) : null;
    modal("ocxPostModal",p?"✏️ Edit Post":"＋ New Post",`
      <label>Post author</label><select id="ocxPostAuthor">${Object.keys(data.characters).map(k=>`<option value="${k}" ${((p?.author||activeActor)===k)?"selected":""}>${data.characters[k].name} (@${data.characters[k].username})</option>`).join("")}</select>
      <label>Caption</label><textarea id="ocxPostCaption" placeholder="Write your OC's caption...">${p?escapeHtml(p.caption):""}</textarea>
      <label>Tag users</label><select id="ocxPostTags" multiple size="5">${Object.keys(data.characters).map(k=>`<option value="${k}" ${(p?.tags||[]).includes(k)?"selected":""}>@${escapeHtml(data.characters[k].username)}</option>`).join("")}<option value="__NONE__" ${!(p?.tags||[]).length?"selected":""}>Nobody</option></select>
      <div class="small-note">Choose Nobody to leave the post untagged. Hold Ctrl (Windows) or Command (Mac) to select multiple users.</div>
      <div class="ocx-grid">
        <div><label>Likes</label><input id="ocxPostLikes" type="number" min="0" value="${p?Number(p.likes)||0:0}"></div>
        <div><label>Photo URL (optional)</label><input id="ocxPostImageUrl" placeholder="https://..." value="${p?escapeAttr(p.image):""}"></div>
      </div>
      <label>Date &amp; time</label><input id="ocxPostDateTime" type="datetime-local" value="${toDateTimeLocal(p?.createdAt||Date.now())}">
      <div class="small-note">You can choose any date, time, and year.</div>
      <label>Upload photo</label><input id="ocxPostFile" class="file-input" type="file" accept="image/*">
      <button class="btn btn-purple btn-full" onclick="OCX.savePost('${editId||""}')">${p?"Save Changes":"Publish Post"}</button>
    `);
    const tagSelect=document.getElementById("ocxPostTags");
    if(tagSelect){
      tagSelect.addEventListener("change",()=>{
        const none=tagSelect.querySelector('option[value="__NONE__"]');
        if(tagSelect.selectedOptions.length>1 && none?.selected) none.selected=false;
        if(none?.selected){[...tagSelect.options].forEach(o=>{if(o.value!=="__NONE__")o.selected=false;});}
      });
    }
  }

  function savePostExtended(id){
    const finish=(image)=>{
      const author=document.getElementById("ocxPostAuthor").value;
      const caption=safe(document.getElementById("ocxPostCaption").value);
      const likes=Math.max(0,Number(document.getElementById("ocxPostLikes").value)||0);
      const tags=[...document.getElementById("ocxPostTags").selectedOptions].map(o=>o.value).filter(v=>v!=="__NONE__");
      const createdAt=timestampFromInput(document.getElementById("ocxPostDateTime")?.value,Date.now());
      if(id){
        const p=data.posts.find(x=>x.id===id);
        if(p){p.author=author;p.caption=caption;p.likes=likes;p.tags=tags;p.createdAt=createdAt;if(image!==undefined)p.image=image;p.updatedAt=Date.now();}
      }else{
        data.posts.unshift({id:"post_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),author,caption,likes,tags,image:image||safe(document.getElementById("ocxPostImageUrl").value),comments:[],createdAt});
      }
      syncLegacyPost(); saveExtended(); renderFeed(); renderPostEditor(); closeModal("ocxPostModal");
    };
    const file=document.getElementById("ocxPostFile").files[0];
    if(file){
      openCropper(file, finish);
    } else finish(undefined);
  }

  function openPostManager(){
    modal("ocxPostsModal","🗂 Manage Posts",`
      <button class="btn btn-purple btn-full" onclick="OCX.openPostCreator()">＋ New Post</button>
      <div class="ocx-post-list" id="ocxPostList" style="margin-top:12px"></div>
    `,true);
    renderPostManager();
  }

  function renderPostManager(){
    const list=document.getElementById("ocxPostList"); if(!list)return;
    list.innerHTML="";
    data.posts.forEach((p,i)=>{
      const a=data.characters[p.author];
      const item=document.createElement("div"); item.className="ocx-post-item";
      item.innerHTML=`<div><strong>${escapeHtml(a?.name||"Unknown")}</strong><br><small>${escapeHtml((p.caption||"").slice(0,90))}</small></div>
      <div style="display:flex;gap:5px"><button class="btn btn-light" onclick="OCX.editPost('${p.id}')">Edit</button><button class="btn btn-danger" onclick="OCX.deletePost('${p.id}')">Delete</button></div>`;
      list.appendChild(item);
    });
    if(!data.posts.length) list.innerHTML='<div class="ocx-empty">No posts yet.</div>';
  }

  function deletePost(id){
    if(data.posts.length<=1 && !confirm("Delete the only post?")) return;
    if(!confirm("Delete this post and its comments?")) return;
    data.posts=data.posts.filter(p=>p.id!==id);
    syncLegacyPost();saveExtended();renderFeed();renderPostManager();
  }

  /* ---------- Feed with multiple posts ---------- */
  function renderFeedExtended(){
    ensureExtendedData();
    const feed=document.getElementById("feed"); if(!feed)return;
    feed.innerHTML="";
    data.posts.forEach(post=>{
      const author=data.characters[post.author]; if(!author)return;
      const article=document.createElement("article");article.className="post";article.dataset.postId=post.id;
      const header=document.createElement("div");header.className="post-header";
      const user=document.createElement("div");user.className="post-user";
      const av=document.createElement("div");av.className="avatar";setAvatar(av,author);
      const txt=document.createElement("div");
      txt.innerHTML=`<div class="post-user-name">${escapeHtml(author.name)}</div><div class="post-user-handle">@${escapeHtml(author.username)}</div>`;
      user.append(av,txt);
      const menu=document.createElement("button");menu.className="post-menu";menu.textContent="•••";menu.onclick=()=>OCX.openPostCreator(post.id);
      header.append(user,menu);

      let img;
      if(post.image){img=document.createElement("img");img.className="post-image";img.src=post.image;img.alt="Post photo";img.onclick=()=>openImageLightbox(post.image);}
      else{img=document.createElement("div");img.className="placeholder-image";img.textContent="✦";}

      const actions=document.createElement("div");actions.className="post-actions";
      const like=document.createElement("button");like.className="icon-btn like-button";like.textContent="♡";like.onclick=()=>{post.likes++;saveExtended();renderFeedExtended();};
      const comment=document.createElement("button");comment.className="icon-btn";comment.textContent="💬";comment.onclick=()=>OCX.openComments(post.id);
      const edit=document.createElement("button");edit.className="icon-btn";edit.textContent="✏️";edit.onclick=()=>OCX.openPostCreator(post.id);
      actions.append(like,comment,edit);

      const body=document.createElement("div");body.className="post-body";
      body.innerHTML=`<div class="likes">${formatCount(post.likes)} likes</div><div class="caption"><strong>${escapeHtml(author.username)}</strong> ${escapeHtml(post.caption||"")}</div>`;

  /* ---------- Proper 1-to-1 DMs ---------- */
  function getUnreadDMCount(actor){
    if(!actor) return 0;
    let count=0;
    Object.keys(data.dms2||{}).forEach(k=>{
      (data.dms2[k]||[]).forEach(m=>{
        if(m && m.from && m.from!==actor && !(Array.isArray(m.readBy)&&m.readBy.includes(actor))){
          const parts=String(k).split("__");
          if(parts.includes(actor)) count++;
        }
      });
    });
    return count;
  }

  function updateUnreadBadge(element, character){
    if(!element || !character) return;
    const actor=Object.keys(data.characters||{}).find(k=>data.characters[k]===character);
    if(!actor) return;
    const count=getUnreadDMCount(actor);
    element.classList.toggle("ocx-has-unread", count>0);
    let badge=element.querySelector(".ocx-unread-badge");
    if(count>0){
      if(!badge){badge=document.createElement("span");badge.className="ocx-unread-badge";element.appendChild(badge);}
      badge.textContent=formatCount(count);
      badge.title=`${count} unread message${count===1?"":"s"}`;
    }else if(badge) badge.remove();
  }

  function markDMThreadRead(actor, other){
    if(!actor || !other) return false;
    const thread=data.dms2[keyPair(actor,other)] || [];

      if(m && m.from===other && !(Array.isArray(m.readBy)&&m.readBy.includes(actor))){

  /* ---------- Cloud ---------- */
  async function initCloud(){
    if(cloud.auth) return true;
    if(!cloudConfigured()){setCloudText("Local mode · cloud not configured",false);return false;}
    try{
      if(typeof firebase === "undefined") throw new Error("Firebase SDK did not load. Check that the Firebase script files are reachable.");
      if(!firebase.apps.length)firebase.initializeApp(OC_FIREBASE_CONFIG);
      cloud.auth=firebase.auth();
      cloud.db=firebase.firestore();
      cloud.enabled=true;

      // Keep the same Firebase login alive when moving between pages/devices.
      try{await cloud.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);}catch(e){console.warn("Firebase auth persistence could not be enabled:",e);}

      cloud.auth.onAuthStateChanged(async user=>{
        cloud.user=user;
        cloudSyncReady=false;
        if(user){
          setCloudText("Signed in · syncing…",true);
          await pullCloud();
        }else{
          setCloudText("Cloud ready · not signed in",false);
        }
      });
      return true;
    }catch(e){
      console.error("Cloud initialization failed:",e);
      cloud.auth=null; cloud.db=null; cloud.enabled=false; cloudSyncReady=false;
      setCloudText("Cloud unavailable · local mode",false);
      return false;
    }
  }

  function setCloudText(text,online){
    const el=document.getElementById("ocxCloudText");if(el)el.innerHTML=`<span class="${online?"ocx-online":"ocx-offline"}">${escapeHtml(text)}</span>`;

  function mergeCloudData(remote, local){
    const r=clone(remote||{}), l=clone(local||{});
    const merged={...r, ...l};

    // Characters: keep remote profiles, but preserve local fields changed
    // while the cloud read was in progress.
    merged.characters={...clone(r.characters||{}), ...clone(l.characters||{})};

    // Posts: never let a stale device replace a newer cloud post collection.
    // Merge by post id and keep the local copy when both sides have the same id.
    const postMap=new Map();
    [...(Array.isArray(r.posts)?r.posts:[]), ...(Array.isArray(l.posts)?l.posts:[])].forEach(post=>{
      if(post&&post.id) postMap.set(String(post.id),clone(post));
    });
    merged.posts=[...postMap.values()].sort((a,b)=>Number(a.createdAt||0)-Number(b.createdAt||0));

    // Merge private message threads by message id so a stale device cannot
    // erase messages received on another device.
    merged.dms2={};
    const keys=new Set([...Object.keys(r.dms2||{}),...Object.keys(l.dms2||{})]);
    keys.forEach(k=>{
      const map=new Map();
      [...(r.dms2?.[k]||[]), ...(l.dms2?.[k]||[])].forEach(m=>{
        if(m&&m.id) map.set(String(m.id),clone(m));
      });
      merged.dms2[k]=[...map.values()].sort((a,b)=>Number(a.createdAt||0)-Number(b.createdAt||0));
    });

    if(r.post||l.post) merged.post=clone(l.post||r.post);
    if(r.dms||l.dms) merged.dms={...clone(r.dms||{}),...clone(l.dms||{})};
    return merged;
  }

  async function pullCloud(){
    if(!cloud.user||!cloud.db)return;
    cloudSyncInProgress=true;
    cloudSyncReady=false;
    try{
      const userRef=cloud.db.collection("ocSocialUsers").doc(cloud.user.uid);
      let rootSnap=null;
      try{ rootSnap=await userRef.get(); }catch(rootErr){
        console.error("Cloud account read failed:",rootErr);
        throw rootErr;
      }

      // v2 stores large collections in subcollections instead of one giant
      // Firestore document. This prevents the 1 MiB document limit from
      // deleting/losing posts as the site grows.
      let meta=rootSnap.exists ? (rootSnap.data()||{}) : null;
      let remote=null;
      if(meta && meta.cloudFormat===2){
        const [charSnap,postSnap,dmSnap,notifSnap,activitySnap]=await Promise.all([
          userRef.collection("characters").get(),
          userRef.collection("posts").get(),
          userRef.collection("dms2").get(),
          userRef.collection("notifications").get(),
          userRef.collection("activities").get()
        ]);
        const characters={};
        charSnap.forEach(doc=>{characters[doc.id]=doc.data().character||doc.data();});
        const posts=[];
        postSnap.forEach(doc=>{const x=doc.data().post||doc.data();if(x&&x.id)posts.push(x);});
        const dms2={};
        dmSnap.forEach(doc=>{const x=doc.data();if(x.threadKey)dms2[x.threadKey]=Array.isArray(x.messages)?x.messages:[];});
        const notifications={};
        notifSnap.forEach(doc=>{notifications[doc.id]=Array.isArray(doc.data().items)?doc.data().items:[];});
        const activityDoc=activitySnap.docs[0];
        remote={
          characters,
          posts,
          dms2,
          notifications,
          activities:activityDoc?.data()?.items||[],
          dms:meta.dms||{},
          post:meta.post||null,
          settings:meta.settings||{}
        };
      }else if(rootSnap.exists){
        // Legacy one-document format. Read it once, then upgrade it to v2.
        remote=meta.data||meta;
      }

      if(remote && remote.characters){
        if(localCloudDirty){
          data=mergeCloudData(remote,data);
        }else{
          data=remote;
        }
        ensureExtendedData();
        populateActorSelects();
        renderEverything();
        renderDMExtended();
        saveAll();
        cloudSyncReady=true;
        cloudSyncInProgress=false;
        // Always upgrade/save through the safe chunked format.
        await saveCloudNow(true);
      }else if(!rootSnap.exists){
        ensureExtendedData();
        cloudSyncReady=true;
        cloudSyncInProgress=false;
        await saveCloudNow(true);
      }else{
        throw new Error("Cloud account exists but contains no character data.");
      }
      setCloudText("Synced to cloud ✓",true);
    }catch(e){
      console.error("Cloud read failed:",e);
      cloudSyncReady=false;
      cloudSyncInProgress=false;
      // Never replace a user's local data with an empty/default cloud result.
      // Keep the current page intact until the cloud can be read successfully.
      setCloudText("Cloud read failed · local copy kept",false);
    }
  }

  async function saveCloudNow(force=false){
    if(!cloud.user||!cloud.db||(!cloudSyncReady&&!force))return;
    if(window.ocCompressAllImages) data=await window.ocCompressAllImages(data);
    try{
      ensureExtendedData();
      const userRef=cloud.db.collection("ocSocialUsers").doc(cloud.user.uid);
      const batch=cloud.db.batch();
      batch.set(userRef,{
        cloudFormat:2,
        settings:clone(data.settings||{}),
        dms:clone(data.dms||{}),
        post:clone(data.post||{}),
        updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      },{merge:true});

      // Characters are separate documents so profile photos cannot make the
      // main account document exceed Firestore's size limit.
      const charRef=userRef.collection("characters");
      for(const [key,character] of Object.entries(data.characters||{})){
        batch.set(charRef.doc(String(key)),{character:clone(character)},{merge:true});
      }

      // Posts are separate documents. This is the important fix for posts
      // disappearing when the account grows or another device signs in.
      const postRef=userRef.collection("posts");
      for(const post of (data.posts||[])){
        if(post?.id) batch.set(postRef.doc(String(post.id)),{post:clone(post)},{merge:true});
      }

      const dmRef=userRef.collection("dms2");
      for(const [threadKey,messages] of Object.entries(data.dms2||{})){
        const safeId=encodeURIComponent(String(threadKey)).slice(0,1500);
        batch.set(dmRef.doc(safeId),{threadKey:String(threadKey),messages:clone(messages||[])},{merge:true});
      }

      const notifRef=userRef.collection("notifications");
      for(const [actor,items] of Object.entries(data.notifications||{})){
        batch.set(notifRef.doc(String(actor)),{items:clone((items||[]).slice(-100))},{merge:true});
      }

      batch.set(userRef.collection("activities").doc("feed"),{items:clone((data.activities||[]).slice(-100))},{merge:true});
      await batch.commit();
      localCloudDirty=false;
      setCloudText("Synced to cloud ✓",true);
    }catch(e){
      console.error("Cloud save failed:",e);
      setCloudText("Cloud save failed · local copy kept",false);
      // Do not clear local data and do not mark it clean.
    }
  }

  function saveExtended(){

    syncLegacyPost();
    saveAll();
    if(cloud.user && cloudSyncReady){
      clearTimeout(cloudSaveTimer);

    }
  }
