  function escapeHtml(s){
    return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }
  function escapeAttr(s){return escapeHtml(s).replace(/`/g,"&#96;");}
  function formatCount(value){
    const n=Number(value);
    if(!Number.isFinite(n)) return "0";
    const abs=Math.abs(n);
    if(abs >= 1000000) return (n/1000000).toFixed(abs >= 10000000 ? 0 : 1).replace(/\.0$/,'')+"m";
    if(abs >= 1000) return (n/1000).toFixed(abs >= 10000 ? 0 : 1).replace(/\.0$/,'')+"k";
    return Math.max(0, Math.trunc(n)).toLocaleString();
  }


  /* ---------- Clickable profiles ---------- */
  let viewedProfileActor = null;

  function ensureProfileFields(character){
    if(!character) return;
    if(!Number.isFinite(Number(character.followers))) character.followers = 0;
    if(!Number.isFinite(Number(character.following))) character.following = 0;
    if(!Array.isArray(character.followingActors)) character.followingActors = [];
  }

  function isFollowing(actor){
    const me=data.characters[activeActor];
    if(!me || actor===activeActor) return false;
    ensureProfileFields(me);
    return me.followingActors.includes(actor);
  }

  function followActor(actor){
    if(!data.characters[actor] || actor===activeActor) return;
    const me=data.characters[activeActor];
    const target=data.characters[actor];
    ensureProfileFields(me);
    ensureProfileFields(target);

    if(me.followingActors.includes(actor)) return;

    me.followingActors.push(actor);
    me.following = me.followingActors.length;
    target.followers = Math.max(0, Number(target.followers)||0) + 1;

    saveExtended();
    renderTopFollowers();
    openCharacterProfile(actor);
  }

  function unfollowActor(actor){
    if(!data.characters[actor] || actor===activeActor) return;
    const me=data.characters[activeActor];
    const target=data.characters[actor];
    ensureProfileFields(me);
    ensureProfileFields(target);

    me.followingActors = me.followingActors.filter(a=>a!==actor);
    me.following = me.followingActors.length;
    target.followers = Math.max(0, (Number(target.followers)||0) - 1);

    saveExtended();
    renderTopFollowers();
    openCharacterProfile(actor);
  }

  function toggleFollowActor(actor){
    if(isFollowing(actor)) unfollowActor(actor);
    else followActor(actor);
  }

  function getCharacterPosts(actor){
    const posts=[];
    const seen=new Set();
    const signature=p=>{
      if(!p) return '';
      return String(p.id||'')+'|'+String(p.author||'')+'|'+String(p.caption||'')+'|'+String(p.image||'')+'|'+String(p.createdAt||'');
    };

    // data.posts is the current source of truth. Do not also append data.post
    // when the normalized posts array already exists, because data.post is the
    // legacy mirror of the first post and would show it twice on profiles.
    if(Array.isArray(data.posts)){
      data.posts.forEach(post=>{
        if(!post || post.author!==actor) return;
        const key=signature(post);
        if(!seen.has(key)){
          seen.add(key);
          posts.push(post);
        }
      });
    }else if(data.post && data.post.author===actor){
      posts.push(data.post);
    }
    return posts;
  }

  function openProfilePost(postId){
    const post = (data.posts || []).find(p => p && p.id === postId);
    if(!post) return;
    closeCharacterProfile();
    renderFeedExtended();
    requestAnimationFrame(()=>{
      const article = document.querySelector('.post[data-post-id="' + CSS.escape(String(postId)) + '"]');
      if(article){
        article.scrollIntoView({behavior:"smooth", block:"center"});
        article.classList.add("ocx-search-hit");
        setTimeout(()=>article.classList.remove("ocx-search-hit"),1800);
      }
    });
  }

  function renderProfileMessages(actor){
    const box=document.getElementById("ocxProfileMessages");
    if(!box) return;
    if(actor!==activeActor){ box.style.display="none"; box.innerHTML=""; return; }

    const unread=[];
    Object.keys(data.dms2||{}).forEach(k=>{
      const parts=String(k).split("__");
      if(!parts.includes(actor)) return;
      const other=parts.find(x=>x!==actor);
      if(!other || !data.characters[other]) return;
      (data.dms2[k]||[]).forEach(m=>{
        if(m && m.from===other && !(Array.isArray(m.readBy)&&m.readBy.includes(actor))){
          unread.push({message:m,other});
        }
      });
    });

    unread.sort((a,b)=>Number(b.message.createdAt||0)-Number(a.message.createdAt||0));
    if(!unread.length){
      box.style.display="none";
      box.innerHTML="";
      return;
    }

    box.style.display="block";
    box.innerHTML=`<div class="ocx-profile-messages-head"><div class="ocx-profile-messages-title">💬 Messages</div><div class="ocx-profile-messages-count">${unread.length}</div></div><div class="ocx-profile-message-list" id="ocxProfileMessageList"></div>`;
    const list=document.getElementById("ocxProfileMessageList");
    unread.forEach(({message,other})=>{
      const c=data.characters[other]||{};
      const item=document.createElement("button");
      item.type="button";
      item.className="ocx-profile-message-item";
      const av=document.createElement("div");
      av.className="avatar";
      setAvatar(av,c);
      const copy=document.createElement("div");
      copy.className="ocx-profile-message-copy";
      const sender=document.createElement("div");
      sender.className="ocx-profile-message-sender";
      sender.textContent=c.name||c.username||other;
      const preview=document.createElement("div");
      preview.className="ocx-profile-message-preview";
      preview.textContent=message.image ? (message.text ? "📷 "+message.text : "📷 Photo message") : (message.text||"Message");
      copy.append(sender,preview);
      const time=document.createElement("div");
      time.className="ocx-profile-message-time";
      time.textContent=formatTimestamp(message.createdAt);
      item.append(av,copy,time);
      item.onclick=()=>{ markDMThreadRead(activeActor,other); openDMFromProfile(other); };
      list.appendChild(item);
    });
  }

  function openCharacterProfile(actor){
    const character=data.characters[actor];
    if(!character) return;
    ensureProfileFields(character);
    viewedProfileActor=actor;

    const screen=document.getElementById('ocxProfileScreen');
    const av=document.getElementById('ocxProfileAvatar');
    setAvatar(av,character);
    av.onclick=null;
    av.style.cursor='default';
    document.getElementById('ocxProfileName').textContent=character.name||character.username||actor;
    document.getElementById('ocxProfileHandle').textContent='@'+(character.username||actor);
    document.getElementById('ocxProfileBio').textContent=character.bio||'';
    document.getElementById('ocxProfileFollowers').textContent=formatCount(character.followers);
    document.getElementById('ocxProfileFollowing').textContent=formatCount(character.following);

    const posts=getCharacterPosts(actor);
    document.getElementById('ocxProfilePostCount').textContent=formatCount(posts.length);
    const grid=document.getElementById('ocxProfilePosts');
    grid.innerHTML='';
    if(!posts.length){
      grid.innerHTML='<div class="ocx-profile-empty" style="grid-column:1/-1">No posts yet.</div>';
    }else{
      posts.forEach(post=>{
        const card=document.createElement('div');
        card.className='ocx-profile-post';
        // Profile previews should be visual thumbnails, not text previews.
        if(post.image){
          const img=document.createElement('img');
          img.src=post.image;
          img.alt='Post photo';
          img.loading='lazy';
          card.appendChild(img);
        }else{
          const placeholder=document.createElement('div');
          placeholder.className='ocx-profile-post-placeholder';
          placeholder.textContent='✦';
          card.appendChild(placeholder);
        }

        // Clicking a post photo/thumbnail takes you to the full post in the feed.
        card.style.cursor='pointer';
        card.title='View post';
        card.onclick=()=>openProfilePost(post.id);

        grid.appendChild(card);
      });
    }

    const actions=document.getElementById('ocxProfileActions');
    actions.innerHTML='';
    if(actor===activeActor){
      const edit=document.createElement('button');
      edit.className='ocx-profile-edit';
      edit.textContent='✏️ Edit profile';
      edit.onclick=()=>{ closeCharacterProfile(); openProfileModal(); };
      actions.appendChild(edit);
    }else{
      const follow=document.createElement('button');
      follow.className='ocx-profile-edit';
      follow.textContent=isFollowing(actor) ? '✓ Following' : '+ Follow';
      follow.onclick=()=>toggleFollowActor(actor);
      actions.appendChild(follow);

      const message=document.createElement('button');
      message.type='button';
      message.className='ocx-profile-message-icon';
      message.textContent='💬';
      message.title='Message @'+(character.username||actor);
      message.setAttribute('aria-label','Message @'+(character.username||actor));
      message.onclick=()=>openDMFromProfile(actor);
      actions.appendChild(message);
    }

    const editBox=document.getElementById('ocxProfileEditBox');
    editBox.style.display='none';
    editBox.innerHTML='';
    if(actor===activeActor){
      editBox.style.display='block';
      editBox.innerHTML=`
        <div class="ocx-profile-section-title">Profile numbers</div>
        <div class="ocx-profile-edit-grid">
          <div><label>Followers</label><input id="ocxFollowersInput" type="number" min="0" value="${Number(character.followers)||0}"></div>
          <div><label>Following</label><input id="ocxFollowingInput" type="number" min="0" value="${Number(character.following)||0}"></div>
        </div>
        <button class="btn btn-purple btn-full" style="margin-top:12px" onclick="OCX.saveProfileNumbers()">💾 Save numbers</button>`;
    }

    renderProfileMessages(actor);
    screen.classList.add('show');
    screen.setAttribute('aria-hidden','false');
  }

  function closeCharacterProfile(){
    const screen=document.getElementById('ocxProfileScreen');
    if(screen){screen.classList.remove('show');screen.setAttribute('aria-hidden','true');}
    viewedProfileActor=null;
  }

  function openDMFromProfile(actor){
    if(!actor || actor===activeActor || !data.characters[actor]) return;
    currentDM=actor;
    saveExtended();
    const select=document.getElementById("dmRecipient");
    if(select) select.value=actor;
    openDMModal(actor);
  }

  function openDMModal(actor){
    actor=actor||currentDM;
    if(!actor || actor===activeActor || !data.characters[actor]) return;
    currentDM=actor;
    markDMThreadRead(activeActor,currentDM);
    let m=document.getElementById("ocxDMModal");
    if(m) m.remove();
    m=document.createElement("div");
    m.className="modal";
    m.id="ocxDMModal";
    const c=data.characters[actor];
    m.innerHTML=`<div class="modal-box ocx-dm-modal-box">
      <div class="modal-header"><div class="modal-title">💬 Message @${escapeHtml(c.username||actor)}</div><button class="close" type="button" aria-label="Close" onclick="OCX.closeDM()">×</button></div>
      <div class="modal-content ocx-dm-modal-content">
        <div class="dm-list" id="ocxDMModalList"></div>
        <label>Date &amp; time for new message</label>
        <input id="ocxDMDateTime" class="ocx-dm-date" type="datetime-local" value="${toDateTimeLocal(Date.now())}">
        <div class="small-note">You can choose any date, time, and year.</div>
        <div class="ocx-dm-compose">
          <input id="ocxDMInput" type="text" placeholder="Write a message..." onkeydown="if(event.key==='Enter') OCX.sendDMFromModal()">
          <button type="button" class="btn btn-light ocx-dm-photo-btn" onclick="document.getElementById('ocxDMPhotoInput').click()" title="Send photo">📷</button>
          <input id="ocxDMPhotoInput" class="file-input" type="file" accept="image/*" style="display:none" onchange="OCX.sendDMPhotoFromModal(this.files[0])">
          <button type="button" class="btn btn-purple" onclick="OCX.sendDMFromModal()">➤</button>
        </div>
      </div>
    </div>`;
    document.body.appendChild(m);
    openModal("ocxDMModal");
    renderDMModal();
  }

  function closeDMModal(){
    const m=document.getElementById("ocxDMModal");
    if(m) m.remove();
  }

  function renderDMModal(){
    const list=document.getElementById("ocxDMModalList");
    if(!list)return;
    const thread=data.dms2[keyPair(activeActor,currentDM)]||[];
    list.innerHTML="";
    const other=data.characters[currentDM];
    if(other){
      const header=document.createElement("div");header.className="ocx-dm-header";
      const av=document.createElement("div");av.className="avatar";setAvatar(av,other);header.append(av);
      const t=document.createElement("div");t.innerHTML=`<strong>${escapeHtml(other.name)}</strong><div class="ocx-dm-status">@${escapeHtml(other.username)} · private chat</div>`;header.appendChild(t);list.appendChild(header);
    }
    thread.forEach(m=>{
      const row=document.createElement("div");row.className="ocx-dm-row";row.dataset.messageId=m.id;
      const bubble=document.createElement("div");bubble.className="message "+(m.from===activeActor?"me":"them");
      if(m.image){
        bubble.classList.add("ocx-dm-photo-wrap");
        const img=document.createElement("img");img.className="ocx-dm-photo";img.src=m.image;img.alt="Photo message";img.onclick=()=>openImageLightbox(m.image);bubble.appendChild(img);
        if(m.text){const cap=document.createElement("div");cap.textContent=m.text;cap.style.marginTop="6px";bubble.appendChild(cap);}
      }else bubble.textContent=m.text||"";
      row.appendChild(bubble);
      const meta=document.createElement("div");meta.className="ocx-message-meta";meta.textContent=formatTimestamp(m.createdAt)+(m.edited?" · edited":"");row.appendChild(meta);
      if(m.from===activeActor&&!m.deleted){
        const tools=document.createElement("div");tools.className="ocx-dm-tools";
        if(!m.image){const edit=document.createElement("button");edit.type="button";edit.textContent="Edit";edit.onclick=()=>editDMModal(m.id);tools.append(edit);}
        const del=document.createElement("button");del.type="button";del.textContent=m.image?"Delete photo":"Delete";del.onclick=()=>deleteDMMessageModal(m.id);tools.append(del);row.appendChild(tools);
      }
      list.appendChild(row);
    });
    list.scrollTop=list.scrollHeight;
  }

  function editDMModal(messageId){
    const thread=data.dms2[keyPair(activeActor,currentDM)]||[];
    const message=thread.find(m=>m.id===messageId&&m.from===activeActor);if(!message)return;
    const n=prompt("Edit message:",message.text);
    if(n?.trim()){message.text=n.trim();message.edited=true;saveExtended();renderDMModal();}
  }

  function deleteDMMessageModal(messageId){
    const thread=data.dms2[keyPair(activeActor,currentDM)]||[];
    const message=thread.find(m=>m.id===messageId&&m.from===activeActor);if(!message)return;
    const label=message.image?"photo":"message";
    if(!confirm(`Delete this ${label} from the DM?`))return;
    data.dms2[keyPair(activeActor,currentDM)]=thread.filter(m=>m.id!==messageId);
    saveExtended();renderDMModal();
  }

  async function sendDMFromModal(){
    const input=document.getElementById("ocxDMInput");const text=safe(input?.value);if(!text||activeActor===currentDM)return;
    const k=keyPair(activeActor,currentDM);if(!data.dms2[k])data.dms2[k]=[];
    const dt=document.getElementById("ocxDMDateTime")?.value;
    data.dms2[k].push({id:"msg_"+Date.now(),from:activeActor,text,createdAt:timestampFromInput(dt,Date.now()),readBy:[activeActor]});
    input.value="";saveExtended();renderDMModal();
  }

  async function sendDMPhotoFromModal(file){
    if(!file||!file.type.startsWith("image/")||activeActor===currentDM)return;
    try{
      const reader=new FileReader();
      reader.onload=async e=>{
        const image=await window.ocCompressDataUrl(e.target.result);
        const k=keyPair(activeActor,currentDM);if(!data.dms2[k])data.dms2[k]=[];
        const dt=document.getElementById("ocxDMDateTime")?.value;
        data.dms2[k].push({id:"msg_"+Date.now()+"_"+Math.random().toString(36).slice(2,6),from:activeActor,text:"",image,createdAt:timestampFromInput(dt,Date.now()),readBy:[activeActor]});
        const f=document.getElementById("ocxDMPhotoInput");if(f)f.value="";saveExtended();renderDMModal();
      };
      reader.readAsDataURL(file);
    }catch(e){console.error(e);alert("The photo could not be sent.");}
  }

  function getFollowers(actor){
    return Object.keys(data.characters||{}).filter(k=>{
      const c=data.characters[k];
      return Array.isArray(c?.followingActors) && c.followingActors.includes(actor);
    });
  }

  function getFollowing(actor){
    const c=data.characters?.[actor];
    return Array.isArray(c?.followingActors) ? c.followingActors.filter(k=>data.characters[k]) : [];
  }

  function showConnections(type){
    const actor=viewedProfileActor;
    if(!actor || !data.characters[actor]) return;
    const people=type==='followers' ? getFollowers(actor) : getFollowing(actor);
    const title=type==='followers' ? 'Followers' : 'Following';
    const m=modal("ocxConnectionsModal",title,`<div class="ocx-connections-list" id="ocxConnectionsList"></div>`,true);
    const list=m.querySelector("#ocxConnectionsList");
    if(!people.length){
      list.innerHTML=`<div class="ocx-empty">No ${type} yet.</div>`;
      return;
    }
    people.forEach(k=>{
      const c=data.characters[k];
      const row=document.createElement("button");
      row.type="button";
      row.className="ocx-connection-row";
      const av=document.createElement("div");
      av.className="avatar";
      setAvatar(av,c);
      const text=document.createElement("div");
      text.innerHTML=`<div class="ocx-connection-name">${escapeHtml(c.name||k)}</div><div class="ocx-connection-handle">@${escapeHtml(c.username||k)}</div>`;
      row.append(av,text);
      row.onclick=()=>{closeModal("ocxConnectionsModal");openCharacterProfile(k);};
      list.appendChild(row);
    });
  }

  function saveProfileNumbers(){
    if(viewedProfileActor!==activeActor) return;
    const character=data.characters[activeActor];
    character.followers=Math.max(0,parseInt(document.getElementById('ocxFollowersInput')?.value||0,10)||0);
    character.following=Math.max(0,parseInt(document.getElementById('ocxFollowingInput')?.value||0,10)||0);
    saveExtended();
    renderTopFollowers();
    openCharacterProfile(activeActor);
  }

  // Make every normal PFP clickable, while leaving the profile editor's PFP alone.
  const baseSetAvatar=window.setAvatar;
  window.setAvatar=function(element,character){
    baseSetAvatar(element,character);
    if(element && element.id!=='editAvatar' && element.id!=='ocxProfileAvatar'){
      const actor=Object.keys(data.characters||{}).find(k=>data.characters[k]===character);
      if(actor){
        element.style.cursor='pointer';
        element.onclick=(event)=>{event.stopPropagation();openCharacterProfile(actor);};
        element.title='Open profile';
      }
    }
    if(element && (element.id==='topbar-avatar' || element.id==='leftAvatar')){
      updateUnreadBadge(element, character);
    }
  };

  /* ---------- Global search ---------- */
  function searchSite(query){
    const box=document.getElementById("ocxSearchResults");
    if(!box)return;
    const raw=String(query??"").trim();
    const q=raw.toLowerCase();
    box.innerHTML="";
    if(!q){box.style.display="none";return;}

    const chars=data.characters||{};
    const posts=Array.isArray(data.posts)?data.posts:[];

    const users=Object.keys(chars).filter(k=>{
      const c=chars[k]||{};
      return [k,c.name,c.username,c.bio].some(v=>String(v??"").toLowerCase().includes(q));
    });

    const matchingPosts=posts.filter(p=>{
      const author=chars[p.author]||{};
      const caption=String(p.caption??"").toLowerCase();
      const hashtagText=(caption.match(/#[\p{L}\p{N}_-]+/gu)||[]).join(" ").toLowerCase();
      const tags=Array.isArray(p.tags)?p.tags.map(k=>String(chars[k]?.username||k)).join(" ").toLowerCase():"";
      const authorText=[p.author,author.name,author.username].map(v=>String(v??"")).join(" ").toLowerCase();
      return caption.includes(q)||hashtagText.includes(q)||tags.includes(q)||authorText.includes(q);
    });

    if(!users.length&&!matchingPosts.length){
      const empty=document.createElement("div");
      empty.className="ocx-search-empty";
      empty.textContent=`No results for "${raw}"`;
      box.appendChild(empty);
      box.style.display="block";
      return;
    }

    const makeResult=(title,sub,actor,post)=>{
      const btn=document.createElement("button");
      btn.type="button";
      btn.className="ocx-search-result";
      const c=actor?chars[actor]:chars[post?.author];
      const av=document.createElement("div");
      av.className="avatar";
      if(c) setAvatar(av,c);
      const main=document.createElement("div");main.className="ocx-search-result-main";
      const t=document.createElement("div");t.className="ocx-search-result-title";t.textContent=title;
      const st=document.createElement("div");st.className="ocx-search-result-sub";st.textContent=sub;
      main.append(t,st);btn.append(av,main);
      btn.addEventListener("click",()=>{
        closeSearch();
        if(actor){
          openCharacterProfile(actor);
          return;
        }
        if(post){
          // Find the exact rendered post. Fall back to a fresh render if needed.
          let article=[...document.querySelectorAll(".post")].find(el=>el.dataset.postId===String(post.id));
          if(!article){
            renderFeedExtended();
            article=[...document.querySelectorAll(".post")].find(el=>el.dataset.postId===String(post.id));
          }
          if(article){
            article.scrollIntoView({behavior:"smooth",block:"center"});
            article.classList.remove("ocx-search-hit");
            void article.offsetWidth;
            article.classList.add("ocx-search-hit");
            setTimeout(()=>article.classList.remove("ocx-search-hit"),1800);
          }
        }
      });
      return btn;
    };

    if(users.length){
      const heading=document.createElement("div");heading.className="ocx-search-section";
      heading.textContent=`Users · ${users.length}`;box.appendChild(heading);
      users.forEach(k=>{
        const c=chars[k]||{};
        box.appendChild(makeResult(c.name||c.username||k,"@"+(c.username||k),k,null));
      });
    }

    if(matchingPosts.length){
      const heading=document.createElement("div");heading.className="ocx-search-section";
      heading.textContent=`Posts · ${formatCount(matchingPosts.length)}`;box.appendChild(heading);
      matchingPosts.forEach(p=>{
        const author=chars[p.author];
        const caption=String(p.caption||"Post");
        const preview=caption.length>90?caption.slice(0,90)+"…":caption;
        box.appendChild(makeResult(author?(author.name||author.username):"Post",
          "@"+(author?.username||p.author||"")+" · "+preview,
          null,p));
      });
    }

    box.style.display="block";
  }

  function closeSearch(){
    const box=document.getElementById("ocxSearchResults");if(box)box.style.display="none";
  }

  document.addEventListener("click",e=>{
    if(!e.target.closest(".ocx-search-wrap"))closeSearch();
  });

  window.OCX={
    openCharacterCreator,createCharacter,
    openPostCreator:openPostCreator,
    savePost:savePostExtended,
    openPostManager,renderPostManager,
    editPost:id=>openPostCreator(id),
    deletePost,
    openComments:openCommentsExtended,
    addComment:addCommentExtended,
    addReply,
    changeDM:changeDMExtended,
    sendDM:sendDMExtended,
    openCloud,login:cloudLogin,register:cloudRegister,logout:cloudLogout,
    openProfile:openCharacterProfile,closeProfile:closeCharacterProfile,openDMFromProfile,openDMModal,closeDM:closeDMModal,sendDMFromModal,sendDMPhotoFromModal,saveProfileNumbers,showConnections,
    sendDMPhoto,deleteDMPhoto,deleteDMMessage,
    follow:followActor,unfollow:unfollowActor,toggleFollow:toggleFollowActor,
    searchSite,
    openImageLightbox,closeImageLightbox,
    close:closeModal
  };

  /* Replace only the relevant render/actions with extended versions. */
  const originalRenderEverything=window.renderEverything;
  window.renderFeed=renderFeedExtended;
  window.renderDM=renderDMExtended;
  window.changeDM=changeDMExtended;
  window.sendDM=sendDMExtended;
  window.openComments=openCommentsExtended;
  window.addComment=addCommentExtended;

  /* Make original UI use the new DM model. */
  function migrateLegacyDMs(){
    if(!data.dms2 || Object.keys(data.dms2).length===0){
      data.dms2={};
      Object.keys(data.dms||{}).forEach(recipient=>{
        if(data.characters[recipient]){
          const k=keyPair(activeActor,recipient);
          data.dms2[k]=(data.dms[recipient]||[]).map(m=>({
            id:"legacy_"+Math.random().toString(36).slice(2),
            from:m.from==="me"?activeActor:recipient,text:m.text,createdAt:m.createdAt||Date.now(),edited:!!m.edited,readBy:m.from==="me"?[activeActor]:[]
          }));
        }
      });
    }
  }

  function bootExtension(){
    ensureExtendedData();
    Object.values(data.characters||{}).forEach(ensureProfileFields);
    migrateLegacyDMs();addExtensionUI();
    populateActorSelects();renderEverything();
    renderFeedExtended();renderDMExtended();
    initCloud();
  }

  /* Original script already called init(); run the extension after it. */
  setTimeout(bootExtension,0);

})();
</script>


<script>
/* OC Social: keep Firestore documents small by compressing uploaded images. */
function openCropper(file, done){
  const overlay=document.getElementById('ocxCropOverlay');
  const stage=document.getElementById('ocxCropStage');
  const img=document.getElementById('ocxCropImage');
  const zoom=document.getElementById('ocxCropZoom');
  const reader=new FileReader();
  reader.onload=e=>{
    const source=new Image();
    source.onload=()=>{
      window.__ocxCrop={source,done,zoom:1,x:0,y:0,drag:false,lastX:0,lastY:0,fit:1,renderedW:0,renderedH:0};
      img.src=e.target.result;
      overlay.style.display='flex';
      zoom.value='1';
      requestAnimationFrame(()=>{
        const size=stage.clientWidth;
        const fit=Math.max(size/source.naturalWidth,size/source.naturalHeight);
        window.__ocxCrop.fit=fit;
        window.__ocxCrop.x=(size-source.naturalWidth*fit)/2;
        window.__ocxCrop.y=(size-source.naturalHeight*fit)/2;
        drawCrop();
      });
    };
    source.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function drawCrop(){
  const c=window.__ocxCrop;if(!c)return;
  const stage=document.getElementById('ocxCropStage');
  const img=document.getElementById('ocxCropImage');
  const size=stage.clientWidth;
  const scale=c.fit*c.zoom;
  const w=c.source.naturalWidth*scale, h=c.source.naturalHeight*scale;
  c.renderedW=w;c.renderedH=h;
  img.style.width=w+'px'; img.style.height=h+'px'; img.style.left=c.x+'px'; img.style.top=c.y+'px';
}
function cropPointerStart(e){const c=window.__ocxCrop;if(!c)return;c.drag=true;c.lastX=e.clientX;c.lastY=e.clientY;document.getElementById('ocxCropStage').setPointerCapture?.(e.pointerId)}
function cropPointerMove(e){const c=window.__ocxCrop;if(!c||!c.drag)return;c.x+=e.clientX-c.lastX;c.y+=e.clientY-c.lastY;c.lastX=e.clientX;c.lastY=e.clientY;drawCrop()}
function cropPointerEnd(){if(window.__ocxCrop)window.__ocxCrop.drag=false}
function cropZoomChanged(){
  const c=window.__ocxCrop;if(!c)return;
  const stage=document.getElementById('ocxCropStage'),size=stage.clientWidth;
  const oldScale=c.fit*c.zoom, oldW=c.source.naturalWidth*oldScale, oldH=c.source.naturalHeight*oldScale;
  const cx=size/2,cy=size/2;
  const relX=(cx-c.x)/oldW, relY=(cy-c.y)/oldH;
  c.zoom=Number(document.getElementById('ocxCropZoom').value);
  const newW=c.source.naturalWidth*c.fit*c.zoom,newH=c.source.naturalHeight*c.fit*c.zoom;
  c.x=cx-relX*newW;c.y=cy-relY*newH;drawCrop();
}
function cancelCrop(){const c=window.__ocxCrop;document.getElementById('ocxCropOverlay').style.display='none';window.__ocxCrop=null}
function applyCrop(){
  const c=window.__ocxCrop;if(!c)return;
  const stage=document.getElementById('ocxCropStage'),size=stage.clientWidth;
  const canvas=document.createElement('canvas');canvas.width=900;canvas.height=900;
  const ctx=canvas.getContext('2d');
  const scale=900/size;
  ctx.drawImage(c.source,(c.x*scale), (c.y*scale), c.source.naturalWidth*c.fit*c.zoom*scale, c.source.naturalHeight*c.fit*c.zoom*scale);
  const result=canvas.toDataURL('image/jpeg',.86);
  const done=c.done;document.getElementById('ocxCropOverlay').style.display='none';window.__ocxCrop=null;done(result);
}
window.OCX=window.OCX||{};
window.OCX.cancelCrop=cancelCrop;window.OCX.applyCrop=applyCrop;
document.addEventListener('DOMContentLoaded',()=>{
  const stage=document.getElementById('ocxCropStage'),zoom=document.getElementById('ocxCropZoom');
  stage.addEventListener('pointerdown',cropPointerStart);stage.addEventListener('pointermove',cropPointerMove);stage.addEventListener('pointerup',cropPointerEnd);stage.addEventListener('pointercancel',cropPointerEnd);zoom.addEventListener('input',cropZoomChanged);
});

(function(){
  const OC_MAX_IMAGE_BYTES = 220000; // target well below Firestore's 1 MB document limit
  const OC_MAX_IMAGE_DIM = 900;

  function ocDataUrlBytes(dataUrl){
    const comma = dataUrl.indexOf(',');
    if(comma < 0) return 0;
    const b64 = dataUrl.slice(comma + 1);
    return Math.floor(b64.length * 3 / 4);
  }

  function ocCompressDataUrl(dataUrl){
    return new Promise((resolve) => {
      if(typeof dataUrl !== 'string' || !dataUrl.startsWith('data:image/')){
        resolve(dataUrl);
        return;
      }

      const img = new Image();
      img.onload = () => {
        let scale = Math.min(1, OC_MAX_IMAGE_DIM / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
        let w = Math.max(1, Math.round((img.naturalWidth || img.width) * scale));
        let h = Math.max(1, Math.round((img.naturalHeight || img.height) * scale));

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', {alpha:false});
        if(!ctx){ resolve(dataUrl); return; }

        canvas.width = w;
        canvas.height = h;
        ctx.drawImage(img, 0, 0, w, h);

        let quality = 0.78;
        let result = canvas.toDataURL('image/jpeg', quality);

        // Reduce quality/dimensions until comfortably small.
        for(let i=0; i<8 && ocDataUrlBytes(result) > OC_MAX_IMAGE_BYTES; i++){
          quality *= 0.78;
          if(quality < 0.35){
            w = Math.max(120, Math.round(w * 0.82));
            h = Math.max(120, Math.round(h * 0.82));
            canvas.width = w;
            canvas.height = h;
            ctx.drawImage(img, 0, 0, w, h);
            quality = 0.62;
          }
          result = canvas.toDataURL('image/jpeg', quality);
        }

        resolve(result);
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    });
  }

  window.ocCompressDataUrl = ocCompressDataUrl;

  window.ocCompressAllImages = async function(obj){
    async function walk(value){
      if(Array.isArray(value)){
        const out = [];
        for(const item of value) out.push(await walk(item));
        return out;
      }
      if(value && typeof value === 'object'){
        const out = {};
        for(const [key, val] of Object.entries(value)) out[key] = await walk(val);
        return out;
      }
      if(typeof value === 'string' && value.startsWith('data:image/')){
        return await ocCompressDataUrl(value);
      }
      return value;
    }
    return await walk(obj);
  };
})();
</script>

<script id="ocx-funpack">
(function(){
  const oldRenderEverything=window.renderEverything;
  const oldOpenCharacterProfile=window.openCharacterProfile;
  const oldRenderFeedExtended=window.renderFeedExtended;
  const oldSendDMFromModal=window.sendDMFromModal;
  const oldToggleFollowActor=window.toggleFollowActor;
  const oldAddCommentExtended=window.addCommentExtended;
  const oldAddReply=window.addReply;
  const oldSavePostExtended=window.savePostExtended;

  function funInit(){
    if(!data.settings) data.settings={};
    if(!data.notifications) data.notifications={};
    if(!data.stories) data.stories=[];
    if(!data.activities) data.activities=[];
    if(!data.blocked) data.blocked={};
    if(!data.muted) data.muted={};
    if(!data.settings.profileMeta) data.settings.profileMeta={};
    Object.keys(data.characters||{}).forEach(k=>{data.characters[k].lastActive=data.characters[k].lastActive||0;});
  }
  function addActivity(type,actor,target,text){
    funInit();
    data.activities.unshift({id:'act_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),type,actor,target,text,createdAt:Date.now()});
    data.activities=data.activities.slice(0,150);
  }
  function notify(actor,type,from,text,target){
    if(!actor || actor===from)return;
    funInit();
    if(!data.notifications[actor])data.notifications[actor]=[];
    data.notifications[actor].unshift({id:'n_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),type,from,text,target,createdAt:Date.now(),read:false});
    data.notifications[actor]=data.notifications[actor].slice(0,100);
  }
  function notifCount(actor){return (data.notifications?.[actor]||[]).filter(n=>!n.read).length;}
  function markNotificationsRead(actor){funInit();(data.notifications[actor]||[]).forEach(n=>n.read=true);saveExtended();renderFunPanels();}
  function renderFunPanels(){
    funInit(); renderNotificationsPanel(); renderActivityPanel(); renderSuggestionsPanel(); renderTrendingPanel(); renderWeeklyPanel(); renderStoriesPanel();
    if(typeof renderTopFollowers==='function')renderTopFollowers(); if(typeof renderTopLikedPosts==='function')renderTopLikedPosts();
    const c=data.characters?.[activeActor]; if(c){c.lastActive=Date.now();}
    updateUnreadBadge(document.getElementById('topbar-avatar'),c); updateUnreadBadge(document.getElementById('leftAvatar'),c);
  }
  function renderNotificationsPanel(){
    const box=document.getElementById('ocxNotificationsList'); if(!box)return;
    const badge=document.getElementById('ocxNotifCount'); if(badge){const n=notifCount(activeActor); badge.textContent=n?('('+n+')'):'';}
    const ns=(data.notifications?.[activeActor]||[]).slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,30);
    box.innerHTML='';
    if(!ns.length){box.innerHTML='<div class="ocx-empty">No notifications yet.</div>';return;}
    ns.forEach(n=>{const row=document.createElement('button');row.type='button';row.className='ocx-notif-row '+(n.read?'':'ocx-notif-unread');row.innerHTML='<div class="ocx-notif-copy"><strong>'+escapeHtml(n.text||'Notification')+'</strong><div class="ocx-notif-time">'+escapeHtml(formatTimestamp(n.createdAt))+'</div></div>'+(n.read?'':'<span class="ocx-notif-count">new</span>');row.onclick=()=>{n.read=true;saveExtended();if(n.target&&data.posts?.some(p=>p.id===n.target)){openProfilePost(n.target)}else if(n.from&&data.characters[n.from]&&n.type==='follow'){openCharacterProfile(n.from)}renderFunPanels();};box.appendChild(row);});
  }
  function renderActivityPanel(){
    const box=document.getElementById('ocxActivityList');if(!box)return;
    const acts=(data.activities||[]).filter(a=>a.actor&&data.characters[a.actor]).slice(0,15);box.innerHTML='';
    if(!acts.length){box.innerHTML='<div class="ocx-empty">What is happening will appear here.</div>';return;}
    acts.forEach(a=>{const row=document.createElement('div');row.className='ocx-activity-row';const c=data.characters[a.actor];const av=document.createElement('div');av.className='avatar';setAvatar(av,c);const copy=document.createElement('div');copy.className='ocx-activity-copy';copy.innerHTML='<strong>'+escapeHtml(c.name||c.username||a.actor)+'</strong> '+escapeHtml(a.text||'did something')+'<div class="ocx-activity-time">'+escapeHtml(formatTimestamp(a.createdAt))+'</div>';row.append(av,copy);box.appendChild(row);});
  }
  function renderSuggestionsPanel(){
    const box=document.getElementById('ocxSuggestionsList');if(!box)return;box.innerHTML='';
    const follows=new Set(data.characters?.[activeActor]?.followingActors||[]);
    const arr=Object.keys(data.characters||{}).filter(k=>k!==activeActor&&!follows.has(k)&&!isBlocked(activeActor,k)).map(k=>({k,c:data.characters[k],score:Number(data.characters[k].followers)||0})).sort((a,b)=>b.score-a.score).slice(0,4);
    if(!arr.length){box.innerHTML='<div class="ocx-empty">No suggestions right now.</div>';return;}
    arr.forEach(x=>{const row=document.createElement('div');row.className='ocx-suggest-row';const av=document.createElement('div');av.className='avatar';setAvatar(av,x.c);const copy=document.createElement('div');copy.className='ocx-suggest-copy';copy.innerHTML='<strong>'+escapeHtml(x.c.name||x.k)+'</strong><div class="small-note">@'+escapeHtml(x.c.username||x.k)+'</div>';const b=document.createElement('button');b.className='ocx-small-btn';b.textContent='+ Follow';b.onclick=()=>{toggleFollowActor(x.k);};row.append(av,copy,b);box.appendChild(row);});
  }
  function renderTrendingPanel(){
    const box=document.getElementById('ocxTrendingList');if(!box)return;box.innerHTML='';
    const counts={};(data.posts||[]).forEach(p=>{const tags=p.tags||[];tags.forEach(t=>{if(t!=='__NONE__')counts[t]=(counts[t]||0)+1;});const words=String(p.caption||'').match(/#[A-Za-z0-9_]+/g)||[];words.forEach(t=>counts[t.toLowerCase()]=(counts[t.toLowerCase()]||0)+1);});
    const arr=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);if(!arr.length){box.innerHTML='<div class="ocx-empty">Add hashtags to make trends.</div>';return;}
    arr.forEach(([t,n])=>{const row=document.createElement('button');row.className='ocx-trend-row';row.type='button';row.innerHTML='<span class="ocx-trend-tag">#'+escapeHtml(t.replace(/^#/,'').replace(/^@/,''))+'</span><span class="small-note">'+n+' post'+(n===1?'':'s')+'</span>';row.onclick=()=>{document.getElementById('ocxSearch')?.focus();};box.appendChild(row);});
  }
  function renderWeeklyPanel(){
    const box=document.getElementById('ocxWeeklyList');if(!box)return;box.innerHTML='';const week=Date.now()-7*864e5;const scores={};
    (data.posts||[]).filter(p=>Number(p.createdAt||0)>=week).forEach(p=>scores[p.author]=(scores[p.author]||0)+(Number(p.likes)||0));
    const arr=Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,5);if(!arr.length){box.innerHTML='<div class="ocx-empty">No posts this week.</div>';return;}
    arr.forEach(([k,n],i)=>{const c=data.characters[k]||{};const row=document.createElement('button');row.className='ocx-trend-row';row.type='button';row.innerHTML='<span class="ocx-weekly-rank">'+(i+1)+'</span><span style="flex:1"><strong>'+escapeHtml(c.name||k)+'</strong><div class="small-note">'+formatCount(n)+' likes this week</div></span>';row.onclick=()=>openCharacterProfile(k);box.appendChild(row);});
  }
  function renderStoriesPanel(){
    const box=document.getElementById('ocxStoriesPanel');if(!box)return;box.innerHTML='';const now=Date.now();data.stories=(data.stories||[]).filter(s=>Number(s.expiresAt||0)>now);
    const strip=document.createElement('div');strip.className='ocx-stories-strip';
    const add=document.createElement('button');add.className='ocx-story-add';add.innerHTML='<div class="ocx-story-circle">＋</div><div class="ocx-story-name">Your story</div>';add.onclick=()=>openStoryCreator();strip.appendChild(add);
    Object.keys(data.characters||{}).forEach(k=>{const s=data.stories.find(x=>x.author===k);if(!s)return;const c=data.characters[k];const wrap=document.createElement('button');wrap.className='ocx-story-add';wrap.innerHTML='<div class="ocx-story-circle"></div><div class="ocx-story-name">'+escapeHtml(c.username||k)+'</div>';setAvatar(wrap.querySelector('.ocx-story-circle'),c);wrap.onclick=()=>viewStory(s);strip.appendChild(wrap);});
    box.appendChild(strip);
  }
  function openStoryCreator(){modal('ocxStoryModal','📸 Add Story','<label>Story text</label><textarea id="ocxStoryText" rows="4" placeholder="What is happening?"></textarea><label>Photo (optional)</label><input id="ocxStoryFile" type="file" accept="image/*"><label>Expires</label><input id="ocxStoryHours" type="number" min="1" max="72" value="24"><button class="btn btn-purple btn-full" onclick="OCX.saveStory()">Post Story</button>');}
  async function saveStory(){const text=safe(document.getElementById('ocxStoryText')?.value);const file=document.getElementById('ocxStoryFile')?.files?.[0];if(!text&&!file)return;funInit();let image='';if(file){image=await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file);});if(window.ocCompressDataUrl)image=await window.ocCompressDataUrl(image);}data.stories.unshift({id:'story_'+Date.now(),author:activeActor,text,image,createdAt:Date.now(),expiresAt:Date.now()+(Number(document.getElementById('ocxStoryHours')?.value)||24)*3600000});addActivity('story',activeActor,null,'posted a new story');saveExtended();closeModal('ocxStoryModal');renderFunPanels();}
  function viewStory(s){const c=data.characters[s.author]||{};const media=s.image?'<img class="ocx-story-view" src="'+s.image+'" alt="Story photo">':'';modal('ocxStoryViewModal','✨ @'+escapeHtml(c.username||s.author),media+'<div style="margin-top:10px">'+escapeHtml(s.text||'')+'</div><div class="small-note" style="margin-top:10px">Expires '+escapeHtml(formatTimestamp(s.expiresAt))+'</div>');}
  function isBlocked(a,b){return !!data.blocked?.[a]?.includes(b);}
  function isMuted(a,b){return !!data.muted?.[a]?.includes(b);}
  function toggleBlock(actor){funInit();if(!data.blocked[activeActor])data.blocked[activeActor]=[];const i=data.blocked[activeActor].indexOf(actor);if(i>=0)data.blocked[activeActor].splice(i,1);else data.blocked[activeActor].push(actor);saveExtended();openCharacterProfile(actor);}
  function toggleMute(actor){funInit();if(!data.muted[activeActor])data.muted[activeActor]=[];const i=data.muted[activeActor].indexOf(actor);if(i>=0)data.muted[activeActor].splice(i,1);else data.muted[activeActor].push(actor);saveExtended();openCharacterProfile(actor);}
  function applyProfileMeta(actor){const m=data.settings?.profileMeta?.[actor]||{};const screen=document.getElementById('ocxProfileScreen');if(!screen)return;screen.style.setProperty('--ocx-profile-accent',m.theme||'#a6285a');const extra=document.getElementById('ocxProfileExtra');if(extra)extra.innerHTML=[m.status?'💭 '+escapeHtml(m.status):'',m.location?'📍 '+escapeHtml(m.location):'',m.listening?'🎵 '+escapeHtml(m.listening):'',m.birthday?'🎂 '+escapeHtml(m.birthday):''].filter(Boolean).join('<br>');}
  function openProfileMetaEditor(){const m=data.settings?.profileMeta?.[activeActor]||{};modal('ocxMetaModal','🎭 Character Extras','<label>Mood / status</label><input id="ocxMetaStatus" value="'+escapeHtml(m.status||'')+'" placeholder="☕ At the café"><label>Currently listening to</label><input id="ocxMetaListening" value="'+escapeHtml(m.listening||'')+'"><label>Birthday</label><input id="ocxMetaBirthday" value="'+escapeHtml(m.birthday||'')+'" placeholder="June 12"><label>Location</label><input id="ocxMetaLocation" value="'+escapeHtml(m.location||'')+'"><label>Profile accent</label><input id="ocxMetaTheme" class="ocx-color-input" type="color" value="'+(m.theme||'#a6285a')+'"><button class="btn btn-purple btn-full" onclick="OCX.saveProfileMeta()">Save</button>');}
  function saveProfileMeta(){funInit();data.settings.profileMeta[activeActor]={status:safe(document.getElementById('ocxMetaStatus')?.value),listening:safe(document.getElementById('ocxMetaListening')?.value),birthday:safe(document.getElementById('ocxMetaBirthday')?.value),location:safe(document.getElementById('ocxMetaLocation')?.value),theme:document.getElementById('ocxMetaTheme')?.value||'#a6285a'};saveExtended();closeModal('ocxMetaModal');openCharacterProfile(activeActor);}
  function createRepost(post){if(!post)return;const copy=clone(post);copy.id='post_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);copy.author=activeActor;copy.repostOf=post.id;copy.createdAt=Date.now();copy.likes=0;copy.comments=[];data.posts.unshift(copy);addActivity('repost',activeActor,post.id,'reposted a post');notify(post.author,'repost',activeActor,'reposted your post',post.id);saveExtended();renderEverything();renderFunPanels();}
  function addReaction(postId,emoji){const p=data.posts.find(x=>x.id===postId);if(!p)return;if(!p.reactions)p.reactions={};if(!p.reactions[activeActor])p.reactions[activeActor]=emoji;else delete p.reactions[activeActor];saveExtended();renderFeedExtended();}
  function reactionSummary(p){const r=p.reactions||{};const counts={};Object.values(r).forEach(e=>counts[e]=(counts[e]||0)+1);return Object.entries(counts).map(([e,n])=>e+' '+n).join('  ');}

  function buildFunUI(){
    if(document.getElementById('ocxFunPanels'))return;
    const right=document.querySelector('.right-column');if(!right)return;
    const wrap=document.createElement('div');wrap.id='ocxFunPanels';wrap.className='ocx-fun-grid';
    wrap.innerHTML='<div class="panel"><div class="panel-title">🔔 Notifications <span id="ocxNotifCount"></span></div><div id="ocxNotificationsList"></div><button class="btn btn-light btn-full" style="margin-top:8px" onclick="OCX.markNotificationsRead()">Mark all read</button></div><div class="panel"><div class="panel-title">✨ What\'s Happening?</div><div id="ocxActivityList"></div></div><div class="panel"><div class="panel-title">📸 Stories</div><div id="ocxStoriesPanel"></div></div><div class="panel"><div class="panel-title">🔥 Trending</div><div id="ocxTrendingList"></div></div><div class="panel"><div class="panel-title">🏆 This Week</div><div id="ocxWeeklyList"></div></div><div class="panel"><div class="panel-title">👥 Who to Follow</div><div id="ocxSuggestionsList"></div></div>';
    const tools=document.getElementById('ocxTools');if(tools)right.insertBefore(wrap,tools);else right.appendChild(wrap);
    renderFunPanels();
  }
  window.OCX=window.OCX||{};
  Object.assign(window.OCX,{saveStory,markNotificationsRead:()=>markNotificationsRead(activeActor),openProfileMetaEditor,saveProfileMeta,toggleBlock,toggleMute,createRepost,addReaction});
  window.addActivity=addActivity;window.notify=notify;

  // Enhance existing profile rendering without removing the site's current UI.
  if(oldOpenCharacterProfile){window.openCharacterProfile=function(actor){oldOpenCharacterProfile(actor);funInit();applyProfileMeta(actor);const actions=document.getElementById('ocxProfileActions');if(actions&&actor===activeActor&&!document.getElementById('ocxMetaEditBtn')){const b=document.createElement('button');b.id='ocxMetaEditBtn';b.className='ocx-profile-edit';b.textContent='🎭 Customize';b.onclick=openProfileMetaEditor;actions.appendChild(b);} if(actions&&actor!==activeActor){const b=document.createElement('button');b.className='ocx-profile-edit';b.textContent=isBlocked(activeActor,actor)?'🚫 Unblock':'🚫 Block';b.onclick=()=>toggleBlock(actor);const m=document.createElement('button');m.className='ocx-profile-edit';m.textContent=isMuted(activeActor,actor)?'🔇 Unmute':'🔇 Mute';m.onclick=()=>toggleMute(actor);actions.append(b,m);} const status=document.getElementById('ocxProfileStatus');if(status){const c=data.characters[actor]||{};const online=Date.now()-(Number(c.lastActive)||0)<300000;status.innerHTML='<span class="ocx-online-dot" style="background:'+(online?'#40a0b8':'#bbb')+'"></span>'+(online?'Online':'Last active '+formatTimestamp(c.lastActive));}};}
  if(oldRenderEverything){window.renderEverything=function(){oldRenderEverything();funInit();buildFunUI();renderFunPanels();};}
  if(oldRenderFeedExtended){window.renderFeedExtended=function(){oldRenderFeedExtended();document.querySelectorAll('.post').forEach(article=>{const id=article.dataset.postId;const p=data.posts.find(x=>x.id===id);if(!p)return;if(p.repostOf&&!article.querySelector('.ocx-repost')){const n=document.createElement('div');n.className='ocx-repost';n.textContent='↻ Reposted';article.querySelector('.post-body')?.prepend(n);}const body=article.querySelector('.post-body');if(body&&!article.querySelector('.ocx-reaction-row')){const rr=document.createElement('div');rr.className='ocx-reaction-row';['❤️','😂','😭','👍','🔥'].forEach(e=>{const b=document.createElement('button');b.textContent=e+(Object.values(p.reactions||{}).filter(x=>x===e).length||'');b.onclick=()=>addReaction(id,e);rr.appendChild(b);});const rb=document.createElement('button');rb.textContent='↻ Repost';rb.onclick=()=>createRepost(p);rr.appendChild(rb);if(p.author===activeActor){const pb=document.createElement('button');pb.textContent=p.pinned?'📌 Unpin':'📌 Pin';pb.onclick=()=>togglePin(id);rr.appendChild(pb);}const sum=document.createElement('span');sum.className='ocx-read-receipt';sum.textContent=reactionSummary(p);rr.appendChild(sum);body.appendChild(rr);}});};}
  if(oldSendDMFromModal){window.sendDMFromModal=async function(){const before=data.dms2[keyPair(activeActor,currentDM)]?.length||0;const r=oldSendDMFromModal.apply(this,arguments);notify(currentDM,'message',activeActor,'sent you a message');addActivity('message',activeActor,currentDM,'sent a message');saveExtended();renderFunPanels();return r;};}
  if(oldToggleFollowActor){window.toggleFollowActor=function(actor){const before=isFollowing(actor);const r=oldToggleFollowActor.apply(this,arguments);if(!before){notify(actor,'follow',activeActor,'started following you');addActivity('follow',activeActor,actor,'followed '+(data.characters[actor]?.name||actor));}saveExtended();renderFunPanels();return r;};}
  if(oldAddCommentExtended){window.addCommentExtended=function(){const p=data.posts.find(x=>x.id===selectedPostId);const r=oldAddCommentExtended.apply(this,arguments);if(p){notify(p.author,'comment',activeActor,'commented on your post',p.id);addActivity('comment',activeActor,p.id,'commented on a post');}renderFunPanels();return r;};}
  if(oldAddReply){window.addReply=function(){const p=data.posts.find(x=>x.id===selectedPostId);const r=oldAddReply.apply(this,arguments);if(p){notify(p.author,'reply',activeActor,'replied to a comment on your post',p.id);}renderFunPanels();return r;};}
  if(oldSavePostExtended){window.savePostExtended=function(){const r=oldSavePostExtended.apply(this,arguments);return r;};}

  function achievementList(actor){
    const c=data.characters?.[actor]||{};const posts=(data.posts||[]).filter(p=>p.author===actor);const likes=posts.reduce((n,p)=>n+(Number(p.likes)||0),0);const msgs=Object.values(data.dms2||{}).flat().filter(m=>m.from===actor).length;const out=[];
    if(posts.length>=1)out.push('🏆 First Post'); if(likes>=100)out.push('❤️ 100 Likes'); if(likes>=1000)out.push('💖 1K Likes'); if(msgs>=100)out.push('💬 100 Messages'); if(Number(c.followers)||0>=10)out.push('👑 10 Followers'); return out;
  }
  function renderBadges(actor){const box=document.getElementById('ocxProfileBadges');if(!box)return;box.innerHTML=achievementList(actor).map(x=>'<span class="ocx-badge">'+escapeHtml(x)+'</span>').join('');}
  function decorateProfile(actor){
    funInit();const screen=document.getElementById('ocxProfileScreen');if(!screen)return;const m=data.settings?.profileMeta?.[actor]||{};const c=data.characters?.[actor]||{};const online=Date.now()-(Number(c.lastActive)||0)<300000;const status=document.getElementById('ocxProfileStatus');if(status)status.innerHTML='<span class="ocx-online-dot" style="background:'+(online?'#40a0b8':'#bbb')+'"></span>'+(online?'Online':'Last active '+(c.lastActive?escapeHtml(formatTimestamp(c.lastActive)):'unknown'))+(m.relationship?' · '+escapeHtml(m.relationship):'');applyProfileMeta(actor);renderBadges(actor);
  }
  function togglePin(postId){const p=data.posts.find(x=>x.id===postId);if(!p||p.author!==activeActor)return;if(p.pinned){delete p.pinned;}else{data.posts.filter(x=>x.author===activeActor).forEach(x=>{delete x.pinned;});p.pinned=true;}saveExtended();renderEverything();}
  function addCommentLike(postId,commentId){const p=data.posts.find(x=>x.id===postId);const c=p?.comments?.find(x=>x.id===commentId);if(!c)return;if(!c.reactionBy)c.reactionBy={};if(c.reactionBy[activeActor])delete c.reactionBy[activeActor];else c.reactionBy[activeActor]='❤️';c.likes=Object.keys(c.reactionBy).length;saveExtended();renderCommentsExtended();}
  function decorateReadReceipts(){const list=document.getElementById('ocxDMModalList');if(!list)return;list.querySelectorAll('[data-message-id]').forEach(row=>{const id=row.getAttribute('data-message-id');const m=(data.dms2[keyPair(activeActor,currentDM)]||[]).find(x=>x.id===id);if(m&&m.from===activeActor){let r=row.querySelector('.ocx-read-receipt');if(!r){r=document.createElement('span');r.className='ocx-read-receipt';row.appendChild(r);}r.textContent=(m.readBy||[]).includes(currentDM)?' · Read':' · Sent';}});}
  function openNotifications(){modal('ocxNotificationsModal','🔔 Notifications','<div id="ocxNotificationsFull"></div><button class="btn btn-light btn-full" style="margin-top:10px" onclick="OCX.markNotificationsRead()">Mark all as read</button>',true);const box=document.getElementById('ocxNotificationsFull');const ns=(data.notifications?.[activeActor]||[]).slice().sort((a,b)=>b.createdAt-a.createdAt);if(!ns.length){box.innerHTML='<div class="ocx-empty">No notifications yet.</div>';return;}ns.forEach(n=>{const r=document.createElement('button');r.className='ocx-notif-row '+(n.read?'':'ocx-notif-unread');r.type='button';r.innerHTML='<div class="ocx-notif-copy"><strong>'+escapeHtml(n.text||'Notification')+'</strong><div class="ocx-notif-time">'+escapeHtml(formatTimestamp(n.createdAt))+'</div></div>';r.onclick=()=>{n.read=true;saveExtended();if(n.target&&data.posts?.some(p=>p.id===n.target))openProfilePost(n.target);else if(n.from&&data.characters[n.from])openCharacterProfile(n.from);renderFunPanels();};box.appendChild(r);});}
  window.OCX.openNotifications=openNotifications;window.OCX.togglePin=togglePin;window.OCX.addCommentLike=addCommentLike;
  if(oldOpenCharacterProfile){
    const wrapped=window.openCharacterProfile;
    window.openCharacterProfile=function(actor){wrapped(actor);decorateProfile(actor);const body=document.querySelector('#ocxProfilePosts');if(body&&actor===activeActor){body.querySelectorAll('.ocx-profile-post').forEach(card=>{const id=card.dataset.postId;if(!id)return;});}}
  }
  if(oldRenderFeedExtended){
    const wrappedFeed=window.renderFeedExtended;
    window.renderFeedExtended=function(){wrappedFeed();document.querySelectorAll('.post').forEach(article=>{const id=article.dataset.postId;const p=data.posts.find(x=>x.id===id);if(!p)return;article.querySelector('.post-body')?.classList.toggle('ocx-is-pinned',!!p.pinned);const rr=article.querySelector('.ocx-reaction-row');if(rr){rr.querySelectorAll('button').forEach((b,i)=>{if(i<5){const e=['❤️','😂','😭','👍','🔥'][i];b.textContent=e+(Object.values(p.reactions||{}).filter(x=>x===e).length||'');}});const sum=rr.querySelector('.ocx-read-receipt');if(sum)sum.textContent=reactionSummary(p);}});document.querySelectorAll('.post').forEach(article=>{const id=article.dataset.postId;const p=data.posts.find(x=>x.id===id);if(!p)return;article.querySelector('.post-body')?.classList.toggle('ocx-is-pinned',!!p.pinned);if(p.pinned&&article.querySelector('.post-user-name')&&!article.querySelector('.ocx-pin')){const pin=document.createElement('div');pin.className='ocx-pin';pin.textContent='📌 Pinned';article.querySelector('.post-user-name').parentElement?.appendChild(pin);} });};
  }
  const oldBuild=buildFunUI;
  buildFunUI=function(){oldBuild();const right=document.querySelector('.right-column');if(right&&!document.getElementById('ocxNotificationsButton')){const b=document.createElement('button');b.id='ocxNotificationsButton';b.className='btn btn-light btn-full';b.textContent='🔔 Open all notifications';b.onclick=openNotifications;const panel=document.getElementById('ocxFunPanels');panel?.prepend(b);} }
  function enhanceMetaEditor(){const m=data.settings?.profileMeta?.[activeActor]||{};const oldOpen=window.OCX.openProfileMetaEditor;}
  // Extend the existing profile extras editor with relationship status.
  const originalMeta=window.OCX.openProfileMetaEditor;
  window.OCX.openProfileMetaEditor=function(){const m=data.settings?.profileMeta?.[activeActor]||{};modal('ocxMetaModal','🎭 Character Extras','<label>Mood / status</label><input id="ocxMetaStatus" value="'+escapeHtml(m.status||'')+'" placeholder="☕ At the café"><label>Currently listening to</label><input id="ocxMetaListening" value="'+escapeHtml(m.listening||'')+'"><label>Birthday</label><input id="ocxMetaBirthday" value="'+escapeHtml(m.birthday||'')+'" placeholder="June 12"><label>Location</label><input id="ocxMetaLocation" value="'+escapeHtml(m.location||'')+'"><label>Relationship status</label><input id="ocxMetaRelationship" value="'+escapeHtml(m.relationship||'')+'" placeholder="Single / Dating / ..."><label>Profile accent</label><input id="ocxMetaTheme" class="ocx-color-input" type="color" value="'+(m.theme||'#a6285a')+'"><button class="btn btn-purple btn-full" onclick="OCX.saveProfileMeta()">Save</button>');};
  const originalSaveMeta=window.OCX.saveProfileMeta;
  window.OCX.saveProfileMeta=function(){funInit();data.settings.profileMeta[activeActor]={status:safe(document.getElementById('ocxMetaStatus')?.value),listening:safe(document.getElementById('ocxMetaListening')?.value),birthday:safe(document.getElementById('ocxMetaBirthday')?.value),location:safe(document.getElementById('ocxMetaLocation')?.value),relationship:safe(document.getElementById('ocxMetaRelationship')?.value),theme:document.getElementById('ocxMetaTheme')?.value||'#a6285a'};saveExtended();closeModal('ocxMetaModal');openCharacterProfile(activeActor);};
  window.setInterval(()=>{if(typeof activeActor!=='undefined'&&data.characters?.[activeActor]){data.characters[activeActor].lastActive=Date.now();if(Date.now()%5<2)saveExtended();renderFunPanels();}},60000);
  document.addEventListener('DOMContentLoaded',()=>{funInit();buildFunUI();renderFunPanels();});
  setTimeout(()=>{try{funInit();buildFunUI();renderFunPanels();}catch(e){console.warn('Fun pack init',e);}},500);
})();
</script>

</body>
