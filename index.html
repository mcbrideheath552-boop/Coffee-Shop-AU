<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OC Social Universe Workspace</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #fafafa; margin: 0; padding: 20px; color: #262626; }
    h1 { text-align: center; color: #7a7aff; margin-bottom: 20px; font-size: 1.6rem; }
    
    /* 🌐 THREE-COLUMN MASTER APPARATUS GRID LAYOUT */
    .master-workspace-layout {
      display: grid;
      grid-template-columns: 320px 1fr 340px;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
      align-items: flex-start;
    }

    /* Column Container Panel Styling */
    .panel-box { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
    .panel-title { font-weight: bold; font-size: 0.95rem; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 12px; color: #7a7aff; display: flex; align-items: center; gap: 6px; }

    /* --- LEFT SIDE COLUMN: PERSONAL 1-ON-1 DMS BOX --- */
    .dm-column-interface { display: flex; flex-direction: column; min-height: 550px; }
    .dm-recipient-selector { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; font-weight: bold; background: #fafafa; }
    .dm-stream-viewport { flex-grow: 1; border: 1px solid #f2f2f2; border-radius: 6px; background: #fbfbfb; padding: 10px; overflow-y: auto; height: 380px; display: flex; flex-direction: column; gap: 8px; }
    .bubble { max-width: 85%; padding: 8px 12px; border-radius: 14px; font-size: 0.85rem; line-height: 1.4; }
    .bubble.left { background: #efefef; color: black; align-self: flex-start; border-bottom-left-radius: 2px; }
    .bubble.right { background: #CCCCFF; color: #333366; align-self: flex-end; border-bottom-right-radius: 2px; }

    /* --- CENTER COLUMN: INSTAGRAM HOME TIMELINE FEED --- */
    .feed-column-interface { max-height: 800px; overflow-y: auto; padding-right: 4px; }
    .post-item-card { border: 1px solid #dbdbdb; border-radius: 8px; margin-bottom: 25px; background: white; overflow: hidden; }
    .post-header { padding: 12px; font-weight: bold; border-bottom: 1px solid #f2f2f2; }
    .post-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; background: #eee; }
    .post-likes-bar { padding: 10px 14px 0 14px; font-size: 0.88rem; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .post-caption { padding: 8px 14px 14px 14px; font-size: 0.92rem; line-height: 1.4; border-bottom: 1px solid #f2f2f2; }
    
    /* Integrated Inline Post Comment Streams */
    .comment-feed-area { padding: 12px; background: #fbfbfb; }
    .comment-row { font-size: 0.85rem; padding: 4px 0; border-bottom: 1px solid #f9f9f9; display: flex; justify-content: space-between; }
    .action-link { font-size: 0.72rem; color: #0095f6; cursor: pointer; font-weight: bold; }

    /* --- RIGHT SIDE COLUMN: STUDIO CONTROL PANEL & ACCOUNTS LIST --- */
    .input-field { width: 100%; padding: 9px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 0.88rem; }
    .select-box { width: 100%; padding: 9px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; font-weight: bold; background: #fafafa; }
    .action-btn { width: 100%; padding: 11px; border: none; border-radius: 5px; color: #333366; font-weight: bold; cursor: pointer; font-size: 0.9rem; background: #CCCCFF; margin-bottom: 8px; }

    /* Dossier Mini Summary Box */
    .mini-hub-box { border-top: 1px dashed #ddd; margin-top: 15px; padding-top: 15px; }
    .mini-avatar-badge { width: 44px; height: 44px; border-radius: 50%; background: #CCCCFF; color: #333366; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1rem; margin-bottom: 8px; }
  </style>
</head>
<body>

  <h1>✨ OC Social Universe Matrix</h1>

  <main class="master-workspace-layout">

    <!-- LEFT SIDE FRAMECOLUMN: PERSONAL CHAT INBOX -->
    <div class="panel-box dm-column-interface">
      <div class="panel-title">💬 Private Dialogue Threads</div>
      <label style="font-size:0.75rem; font-weight:bold; color:#666;">Chatting With Target:</label>
      <select id="dm-recipient-selector" class="dm-recipient-selector" onchange="switchPrivateChatThread(this.value)">
        <option value="Coffee_Shop_Hero">⚔️ @Coffee_Shop_Hero</option>
        <option value="Barista_Arin">☕ @Barista_Arin</option>
        <option value="Grumpy_Regular">📖 @Grumpy_Regular</option>
        <option value="Chai_Enthusiast">✨ @Chai_Enthusiast</option>
      </select>
      
      <div id="dm-log-viewport" class="dm-stream-viewport"></div>
      
      <div style="margin-top:10px; display:flex; gap:4px;">
        <input type="text" id="dm-typed-input" class="input-field" placeholder="Type DM text line..." style="margin:0; padding:6px;">
        <button style="background:#7a7aff; border:none; padding:0 12px; color:white; font-weight:bold; border-radius:4px; cursor:pointer; font-size:0.8rem;" onclick="submitPrivateDMMessage()">Send</button>
      </div>
    </div>

    <!-- CENTER FRAMECOLUMN: LIVE INSTAGRAM HOME TIMELINE FEED -->
    <div class="feed-column-interface" id="feed-column-list"></div>

    <!-- RIGHT SIDE FRAMECOLUMN: GLOBAL ACTOR MANAGER & CREATOR STUDIO -->
    <div class="panel-box">
      <div class="panel-title">👤 Active Account Manager</div>
      <label style="font-size:0.75rem; font-weight:bold; color:#666;">Control Profile Character:</label>
      <select id="actor-selector" class="select-box" onchange="swapActiveGlobalActor(this.value)">
        <option value="Barista_Arin">☕ @Barista_Arin</option>
        <option value="Coffee_Shop_Hero">⚔️ @Coffee_Shop_Hero</option>
        <option value="Grumpy_Regular">📖 @Grumpy_Regular</option>
        <option value="Chai_Enthusiast">✨ @Chai_Enthusiast</option>
      </select>

      <div class="panel-title" style="margin-top:15px;">⚙️ Creator Studio Panel</div>
      <p style="font-size:0.75rem; color:#666; margin:0 0 10px 0; line-height:1.3;">Add art links and captions below to instantly inject content cards into the center grid.</p>
      
      <input type="file" id="studio-upload-file" class="input-field" onchange="processLocalArtAttachment(this)" style="padding:4px;">
      <input type="text" id="studio-image-url" class="input-field" placeholder="Or paste web image link...">
      <input type="text" id="studio-caption" class="input-field" placeholder="Type post caption lore...">
      <input type="number" id="studio-likes" class="input-field" value="32">
      
      <button class="action-btn" onclick="publishNewStudioPostCard()">Publish Post Card to Feed</button>

      <div class="mini-hub-box" id="mini-dossier-card-hub"></div>
    </div>

  </main>

  <script>
    const registryOcs = {
      "Barista_Arin": { name: "Arin ☕", followers: "1,240", bio: "Main barista at the shop counter. Secretly brewing experimental magic espresso lines. Always tired.", code: "AR" },
      "Coffee_Shop_Hero": { name: "Hero ⚔️", followers: "45.8K", bio: "The local neighborhood defender. Orders triple espresso shots and falls asleep in beanbags.", code: "HE" },
      "Grumpy_Regular": { name: "Regular 📖", bio: "Sits in the back booth reading ancient script manuscripts. Complains about steam wands.", followers: "142", code: "RE" },
      "Chai_Enthusiast": { name: "Chai ✨", bio: "Orders extra sugary customized iced Chais. Takes aesthetic photos of pastry display cases.", followers: "3,890", code: "CH" }
    };

    let activeActor = "Barista_Arin";
    let activeChatRecipient = "Coffee_Shop_Hero";
    let base64LocalPhotoBuffer = "";

    let internalPosts = [
      { id: 2, author: "Chai_Enthusiast", likes: 84, img: "https://unsplash.com", cap: "Look at this cute cozy booth setup! Studying here all afternoon. 🌧️📑" },
      { id: 1, author: "Barista_Arin", likes: 142, img: "https://unsplash.com", cap: "Opening up the bakery counter early today. The cinnamon rolls just finished baking! ☕🥖" }
    ];
    let internalComments = [
      { id: 11, post_id: 1, author: "Grumpy_Regular", text: "Save two for me, Arin. Don't let the morning rush steal them." }
    ];
    let internalDMs = [
      { from: "Coffee_Shop_Hero", to: "Barista_Arin", text: "Hey Arin! Is the espresso machine heated up yet?" },
      { from: "Barista_Arin", to: "Coffee_Shop_Hero", text: "Just turned it on, come on in!" }
    ];

    function swapActiveGlobalActor(val) {
      activeActor = val;
      const options = Object.keys(registryOcs).filter(k => k !== val);
      if(activeChatRecipient === val && options.length > 0) {
        activeChatRecipient = options[0];
        document.getElementById('dm-recipient-selector').value = options[0];
      }
      renderTimelineLayout();
      renderChatStreamLogs();
      renderMiniAccountDossier();
    }

    function switchPrivateChatThread(val) {
      activeChatRecipient = val;
      renderChatStreamLogs();
    }

    function renderTimelineLayout() {
      const container = document.getElementById('feed-column-list');
      if (!container) return;
      container.innerHTML = '';

      internalPosts.forEach(post => {
        const commentsHTML = internalComments.filter(c => c.post_id === post.id).map(c => `
          <div class="comment-row">
            <span><b>@${c.author}:</b> <span>${c.text}</span></span>
            <span class="action-link" onclick="editInlineCommentDialogue(${c.id})">[Edit]</span>
          </div>
        `).join('');

        const card = document.createElement('div');
        card.className = 'post-item-card';
        card.innerHTML = `
          <div class="post-header">✨ @${post.author}</div>
          <img class="post-img" src="${post.img}" alt="Art Card">
