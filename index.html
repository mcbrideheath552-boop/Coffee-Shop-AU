<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OC Social Network</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafafa; margin: 0; padding: 20px; color: #262626; }
    h1 { text-align: center; color: #A993D9; margin-bottom: 20px; font-size: 1.6rem; font-weight: bold; }
    
    /* 🌐 THREE-COLUMN MASTER APPARATUS GRID LAYOUT */
    .master-workspace-layout {
      display: grid;
      grid-template-columns: 320px 1fr 340px;
      gap: 20px;
      max-width: 1440px;
      margin: 0 auto;
      align-items: flex-start;
    }

    /* Column Container Panel Styling */
    .panel-box { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
    .panel-title { font-weight: bold; font-size: 0.95rem; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 12px; color: #A993D9; display: flex; align-items: center; gap: 6px; }

    /* --- LEFT SIDE COLUMN: PERSONAL 1-ON-1 DMS BOX (CENTERED FLANK) --- */
    .dm-column-interface { display: flex; flex-direction: column; height: 550px; }
    .dm-recipient-selector { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; font-weight: bold; background: #fafafa; }
    .dm-stream-viewport { flex-grow: 1; border: 1px solid #f2f2f2; border-radius: 6px; background: #fbfbfb; padding: 10px; overflow-y: auto; height: 380px; display: flex; flex-direction: column; gap: 8px; }
    .bubble { max-width: 85%; padding: 8px 12px; border-radius: 14px; font-size: 0.85rem; line-height: 1.4; margin-bottom: 4px; position: relative; }
    .bubble.left { background: #efefef; color: black; align-self: flex-start; border-bottom-left-radius: 2px; }
    .bubble.right { background: #A993D9; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .bubble-meta { font-size: 0.68rem; color: #8e8e8e; font-weight: bold; margin-bottom: -2px; display: block; }

    /* --- CENTER COLUMN: INSTAGRAM HOME TIMELINE FEED --- */
    .feed-column-interface { max-height: 800px; overflow-y: auto; padding-right: 4px; }
    .post-item-card { border: 1px solid #dbdbdb; border-radius: 8px; margin-bottom: 25px; background: white; overflow: hidden; max-width: 550px; margin-left: auto; margin-right: auto; }
    .post-header { padding: 10px 14px; font-weight: bold; border-bottom: 1px solid #f2f2f2; font-size: 0.88rem; display: flex; align-items: center; justify-content: space-between; }
    .post-header-left { display: flex; align-items: center; gap: 8px; }
    
    /* 5. FIX PHOTO CROPPING: Forces a clean 1:1 circle thumbnail cut */
    .post-header-avatar { width: 32px; height: 32px; border-radius: 50%; background: #A993D9; overflow: hidden; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.8rem; font-weight: bold; border: 1px solid #eee; }
    .post-header-avatar img { width: 100%; height: 100%; object-fit: cover; }
    
    /* 5. FIX PHOTO CROPPING: Enforces clean Instagram square display without stretching distortion */
    .post-img-real { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; border-bottom: 1px solid #eee; background: #fbfbfb; }
    .post-img-placeholder { width: 100%; aspect-ratio: 1/1; background: #e0d9f0; display: flex; align-items: center; justify-content: center; color: #7a7aff; font-size: 2rem; font-weight: bold; border-bottom: 1px solid #eee; }
    
    .post-likes-bar { padding: 10px 14px 2px 14px; font-size: 0.85rem; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .post-caption { padding: 4px 14px 12px 14px; font-size: 0.88rem; line-height: 1.4; }
    .comment-open-btn { display: block; width: 100%; text-align: center; padding: 10px; background: #fbfbfb; border: none; border-top: 1px solid #efefef; font-size: 0.85rem; font-weight: bold; color: #0095f6; cursor: pointer; }

    /* --- RIGHT SIDE COLUMN: CREATOR PANEL --- */
    .input-field { width: 100%; padding: 9px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 0.88rem; }
    .select-box { width: 100%; padding: 9px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; font-weight: bold; background: #fafafa; }
    .action-btn { width: 100%; padding: 11px; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; font-size: 0.9rem; background: #A993D9; margin-bottom: 8px; }
    .action-link { font-size: 0.72rem; color: #0095f6; cursor: pointer; font-weight: bold; }
    
    .mini-hub-box { border-top: 1px dashed #ddd; margin-top: 15px; padding-top: 15px; }
    .mini-avatar-badge { width: 50px; height: 40px; border-radius: 50%; background: #A993D9; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.1rem; margin-bottom: 8px; overflow: hidden; border: 1px solid #eee; }
    .mini-avatar-badge img { width: 100%; height: 100%; object-fit: cover; }

    /* POP-UP MODAL WINDOW OVERLAYS */
    .modal-overlay-backdrop { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center; }
    .modal-window-box { background: white; width: 90%; max-width: 500px; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
    .modal-scroll-pane { max-height: 280px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #eee; border-radius: 6px; padding: 10px; background: #fbfbfb; }
    .comment-item-card { padding: 10px 0; font-size: 0.88rem; border-bottom: 1px solid #eee; }
    .comment-actions-row { font-size: 0.75rem; color: #8e8e8e; font-weight: bold; margin-top: 4px; display: flex; gap: 10px; }
    .reply-nested-box { margin-left: 20px; padding-left: 10px; border-left: 2px solid #efefef; margin-top: 6px; display: flex; flex-direction: column; gap: 5px; background: #f9f9f9; padding: 6px; border-radius: 4px; }
  </style>
</head>
<body>

  <h1>OC Social Network</h1>

  <main class="master-workspace-layout">

    <!-- LEFT COLUMN: PERSISTENT PRIVATE CHATS (POLISHED) -->
    <div class="panel-box dm-column-interface">
      <div class="panel-title">💬 Private Dialogue Threads</div>
      <label style="font-size:0.75rem; font-weight:bold; color:#666;">Chatting With Target:</label>
      <select id="dm-recipient-selector" class="select-box" onchange="window.switchPrivateChatThread(this.value)">
        <option value="Coffee_Shop_Hero">⚔️ @Coffee_Shop_Hero</option>
        <option value="Barista_Arin">☕ @Barista_Arin</option>
        <option value="Grumpy_Regular">📖 @Grumpy_Regular</option>
        <option value="Chai_Enthusiast">✨ @Chai_Enthusiast</option>
      </select>
      
      <div id="dm-log-viewport" class="dm-stream-viewport"></div>
      
      <div style="margin-top:10px; display:flex; gap:4px;">
        <input type="text" id="dm-typed-input" class="input-field" placeholder="Type DM text line..." style="margin:0; padding:6px;">
        <button style="background:#A993D9; border:none; padding:0 12px; color:white; font-weight:bold; border-radius:4px; cursor:pointer; font-size:0.8rem;" onclick="window.submitPrivateDMMessage()">Send</button>
      </div>
    </div>

    <!-- CENTER COLUMN: INSTAGRAM HOME TIMELINE FEED (SCROLLABLE TIMELINE) -->
    <div class="feed-column-interface" id="feed-column-list"></div>

    <!-- RIGHT COLUMN: GLOBAL SWITCHER & CREATOR DECK -->
    <div class="panel-box">
      <div class="panel-title">👤 Active Account Manager</div>
      <label style="font-size:0.75rem; font-weight:bold; color:#666;">Control Profile Character:</label>
      <select id="actor-selector" class="select-box" onchange="window.swapActiveGlobalActor(this.value)">
        <option value="Barista_Arin">☕ @Barista_Arin</option>
        <option value="Coffee_Shop_Hero">⚔️ @Coffee_Shop_Hero</option>
        <option value="Grumpy_Regular">📖 @Grumpy_Regular</option>
        <option value="Chai_Enthusiast">✨ @Chai_Enthusiast</option>
      </select>

      <div class="panel-title" style="margin-top:15px;">⚙️ Creator Studio Panel</div>
      <p style="font-size:0.75rem; color:#666; margin:0 0 10px 0; line-height:1.3;">Add image links and captions below to instantly inject content cards into the feed.</p>
      
      <input type="text" id="studio-image-url" class="input-field" placeholder="Paste image web link (URL)...">
      <input type="text" id="studio-caption" class="input-field" placeholder="Type post caption lore...">
      <input type="number" id="studio-likes" class="input-field" value="40" placeholder="Likes starting count...">
      
      <!-- 2. PUBLISH CARD SYSTEM: Injects new cards at the very top of the scrollable stack -->
      <button class="action-btn" onclick="window.publishNewStudioPostCard()">Publish Post Card to Feed</button>

      <div class="mini-hub-box" id="mini-dossier-card-hub"></div>
    </div>

  </main>

  <!-- 📌 POPUP WINDOW 1: OVER-THE-TOP COMMENTS POPUP VIEW -->
  <div id="comment-overlay-window" class="modal-overlay-backdrop">
    <div class="modal-window-box">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding-bottom:8px; margin-bottom:12px;">
        <span style="font-weight:bold; color:#A993D9;">📝 Comments Panel</span>
        <button style="border:none; background:none; font-weight:bold; cursor:pointer; color:#8e8e8e; font-size:1.1rem;" onclick="window.closeCommentsModal()">✕</button>
      </div>
      <div id="modal-comments-pane" class="modal-scroll-pane"></div>
      <div style="display:flex; gap:6px;">
        <input type="text" id="modal-comment-input" class="input-field" placeholder="Type comment dialogue..." style="margin:0;">
