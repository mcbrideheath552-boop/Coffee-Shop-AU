<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OC Social Network</title>
    <style>
        :root {
            --bg-color: #fafafa;
            --card-bg: #ffffff;
            --border-color: #dbdbdb;
            --text-color: #262626;
            --text-muted: #737373;
            --accent-color: #0095f6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 40px; }
        header { background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 15px 40px; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.5rem; font-style: italic; }
        
        /* 3-Column Layout Grid Setup */
        .dashboard-container { 
            max-width: 1400px; 
            margin: 20px auto; 
            display: grid; 
            grid-template-columns: 320px 1fr 350px; 
            gap: 20px; 
            padding: 0 20px; 
            align-items: start;
        }

        /* Responsive Layout for Smaller Screens */
        @media (max-width: 1100px) {
            .dashboard-container { grid-template-columns: 1fr; }
            .left-column, .right-column { position: static; }
        }

        /* Fixed / Sticky Layout Columns for smooth scrolling */
        .left-column { position: sticky; top: 90px; display: flex; flex-direction: column; gap: 20px; }
        .center-column { display: flex; flex-direction: column; gap: 20px; }
        .right-column { position: sticky; top: 90px; display: flex; flex-direction: column; gap: 20px; max-height: calc(100vh - 120px); overflow-y: auto; padding-right: 4px; }

        /* General Panel Cards */
        .panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; }
        .panel h3 { font-size: 0.95rem; margin-bottom: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Feed & Posts (Center Column) */
        .feed { display: flex; flex-direction: column; gap: 24px; }
        .post-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        .post-header { display: flex; align-items: center; padding: 12px; gap: 10px; border-bottom: 1px solid #efefef; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #eee; }
        .post-author { font-weight: 600; font-size: 0.9rem; }
        .post-img { width: 100%; max-height: 600px; object-fit: cover; background: #f0f0f0; }
        .post-actions { padding: 12px; display: flex; gap: 15px; font-size: 1.2rem; }
        .post-body { padding: 0 12px 12px 12px; font-size: 0.9rem; }
        .likes-count { font-weight: 600; margin-bottom: 5px; }
        .caption-text { margin-bottom: 8px; }
        
        /* Comments Sections */
        .comments-section { border-top: 1px solid #efefef; padding-top: 8px; margin-top: 8px; }
        .comment-item { margin-bottom: 4px; font-size: 0.85rem; }
        .comment-user { font-weight: 600; margin-right: 6px; }
        .comment-input-box { display: flex; border-top: 1px solid #efefef; padding: 8px 12px; gap: 8px; align-items: center; }
        .comment-input-box select { padding: 4px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.8rem; max-width: 110px; }
        .comment-input-box input { flex: 1; border: none; outline: none; font-size: 0.85rem; }
        .comment-btn { color: var(--accent-color); font-weight: 600; background: none; border: none; cursor: pointer; font-size: 0.85rem; }

        /* Form styling elements */
        .form-group { margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 0.8rem; font-weight: 600; }
        .form-group input, .form-group textarea, .form-group select { padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.9rem; width: 100%; }
        
        .btn { background: var(--accent-color); color: white; border: none; padding: 8px 12px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 0.9rem; width: 100%; text-align: center; }
        .btn-secondary { background: #333; }
        .btn:hover { opacity: 0.9; }

        /* Active Account Switcher Display */
        .account-switcher { display: flex; align-items: center; gap: 10px; padding: 8px; background: #f0f0f0; border-radius: 6px; margin-bottom: 10px; }

        /* Polished DMs Panel (Left Column Optimization) */
        .dm-window { height: 400px; border: 1px solid var(--border-color); border-radius: 4px; display: flex; flex-direction: column; margin-top: 10px; background: #fff; }
        .dm-messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; }
        .message { padding: 6px 10px; border-radius: 12px; max-width: 80%; word-break: break-word; line-height: 1.3; }
        .message.sent { background: var(--accent-color); color: white; align-self: flex-end; }
        .message.received { background: #efefef; color: var(--text-color); align-self: flex-start; }
        .dm-input { display: flex; border-top: 1px solid var(--border-color); }
        .dm-input input { flex: 1; border: none; padding: 8px; outline: none; font-size: 0.85rem; }
        
        .sync-box { font-size: 0.75rem; color: var(--text-muted); background: #eee; padding: 8px; border-radius: 4px; margin-top: 10px; word-break: break-all; max-height: 80px; overflow-y: auto; }
    </style>
</head>
<body>

    <header>
        <h1>✦ OC Social</h1>
        <div style="display: flex; gap: 15px; align-items: center;">
            <div id="top-profile-display" style="display: flex; align-items: center; gap: 8px;">
                <!-- Filled dynamically via JS context -->
            </div>
        </div>
    </header>

    <div class="dashboard-container">
        
        <!-- LEFT COLUMN: Private DMs -->
        <div class="left-column">
            <div class="panel" style="position: sticky; top: inherit;">
                <h3>💬 Private DMs</h3>
                <div class="form-group">
                    <label for="dm-target-select">Chatting with:</label>
                    <select id="dm-target-select" onchange="loadDMMessages()"></select>
                </div>
                <div class="dm-window">
                    <div class="dm-messages" id="dm-messages-container"></div>
                    <div class="dm-input">
                        <input type="text" id="dm-text" placeholder="Type a message...">
                        <button class="comment-btn" style="padding: 0 12px;" onclick="sendDM()">➤</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- CENTER COLUMN: Main Scrolling Feed (Newest on top) -->
        <div class="center-column">
            <div class="feed" id="main-feed">
                <!-- Posts render here dynamically -->
            </div>
        </div>

        <!-- RIGHT COLUMN: User controls, Create Panels, and Data Sync -->
        <div class="right-column">
            
            <!-- Active Account Context Switcher -->
            <div class="panel">
                <h3>👤 Active Account</h3>
                <div class="account-switcher">
                    <img id="active-avatar" class="avatar" src="" alt="">
                    <div>
                        <div id="active-display-name" style="font-weight: 600; font-size: 0.9rem;"></div>
                        <div id="active-username" style="color: var(--text-muted); font-size: 0.8rem;"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="switch-user-select">Switch character context:</label>
                    <select id="switch-user-select" onchange="changeActiveUser(this.value)"></select>
                </div>
            </div>

            <!-- Create / Edit Users Directory -->
            <div class="panel">
                <h3>✏ Add / Edit OC Directory</h3>
                <div class="form-group">
                    <label for="edit-user-select">Select OC to edit (or choose New):</label>
                    <select id="edit-user-select" onchange="populateUserForm(this.value)">
                        <option value="new">+ Create New Character</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="oc-username" placeholder="@username">
                </div>
                <div class="form-group">
                    <label>Display Name</label>
                    <input type="text" id="oc-display-name" placeholder="Character Name">
                </div>
                <div class="form-group">
                    <label>Bio</label>
                    <textarea id="oc-bio" rows="2" placeholder="OC Bio..."></textarea>
                </div>
                <div class="form-group">
                    <label>Profile Picture URL</label>
                    <input type="text" id="oc-avatar" placeholder="https://placehold.co">
                </div>
                <button class="btn" onclick="saveUser()">💾 Save Character Profile</button>
            </div>

            <!-- Create New Posts Panel -->
            <div class="panel">
                <h3>📝 Create New Feed Post</h3>
                <div class="form-group">
                    <label for="post-author-select">Post Author:</label>
                    <select id="post-author-select"></select>
                </div>
