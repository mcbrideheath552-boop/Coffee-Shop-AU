<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OC Social Universe</title>
  
  <!-- Bypasses strict network blocks using an alternate high-security library mirror -->
  <script src="https://cloudflare.com" integrity="sha512-Y3f6/A06rIcl9f3Y689gAsSOf9R64wV59uA/+mZfWp6YV0p7I/gC7NreN/qXfWlHh339N8XN4bM7wXw86NfS0g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <style>
    /* Global Resets and Visual Themes */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #fafafa;
      color: #262626;
    }

    /* Fixed Top App Navigation Bar */
    .app-header {
      background: #ffffff;
      border-bottom: 1px solid #dbdbdb;
      text-align: center;
      padding: 14px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .app-header h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* Main Responsive Container Layout */
    .instagram-container {
      max-width: 935px;
      margin: 20px auto;
      padding: 0 20px;
    }

    /* 3-Column Instagram Profile Grid Layout */
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    /* Standard Core Post Card Component Layout */
    .post-card {
      background: #ffffff;
      border: 1px solid #dbdbdb;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Force Square Crop Aspect Ratio For Art/Images */
    .post-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }

    /* Layout Styling For Captions & User Labels Below Pictures */
    .post-content {
      padding: 14px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .post-username {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 6px;
      color: #000000;
    }
    .post-caption {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.4;
      color: #4a4a4a;
    }

    /* Responsive CSS Adjustments for Small Mobile Phone Interfaces */
    @media (max-width: 735px) {
      .instagram-container {
        padding: 0;
        margin: 0;
      }
      .posts-grid {
        gap: 3px;
      }
      .post-card {
        border: none;
        border-radius: 0;
      }
      .post-content {
        display: none;
      }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h1>✨ OCgram</h1>
  </header>

  <main class="instagram-container">
    <div id="posts-grid" class="posts-grid">
      <p style="grid-column: 1 / -1; text-align: center; color: #8e8e8e; padding: 40px 0;">
        Connecting securely to your universe...
      </p>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBtdWNvYXZxbXF3Y2N2em1vdHdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MzE5MzQsImV4cCI6MjEwNTQwNzkzNH0.H4md913bLmWuRuIM00bBsYCasASLlIaJHoiIalar-Ns'; 

    // Initializing using the global library from our fallback link
    const supabaseApp = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function fetchOCPosts() {
      const { data: posts, error } = await supabaseApp
        .from('posts')
        .select(`
          id, image_url, caption, created_at,
          characters ( username, avatar_url )
        `)
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Database connection error:', error);
        document.getElementById('posts-grid').innerHTML = `
          <p style="grid-column: 1 / -1; text-align: center; color: red; padding: 20px;">
            Connection Error. Please confirm Row Level Security (RLS) is fully disabled for your tables inside Supabase.
          </p>`;
        return;
      }

      renderGrid(posts);
    }

    function renderGrid(posts) {
      const gridContainer = document.getElementById('posts-grid');
      
      if (!posts || posts.length === 0) {
        gridContainer.innerHTML = `
          <p style="grid-column: 1 / -1; text-align: center; color: #8e8e8e; padding: 40px 0;">
            Connected to database! No posts found yet. Go ahead and add rows inside your Supabase tables to start worldbuilding!
          </p>`;
        return;
      }

      gridContainer.innerHTML = '';

      posts.forEach(post => {
        const postElement = document.createElement('div');
        postElement.className = 'post-card';
        
        postElement.innerHTML = `
          <img src="${post.image_url}" class="post-image" alt="OC Visual Art Piece">
          <div class="post-content">
            <div class="post-username">@${post.characters?.username || 'unknown_character'}</div>
            <p class="post-caption">${post.caption || ''}</p>
          </div>
        `;
        
        gridContainer.appendChild(postElement);
      });
    }

    window.addEventListener('DOMContentLoaded', fetchOCPosts);
  </script>
</body>
</html>
