<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OC Social Universe</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafafa; margin: 0; padding: 20px; color: #262626; }
    h1 { text-align: center; color: #7a7aff; margin-bottom: 20px; font-size: 1.6rem; }
    
    /* 🌐 DYNAMIC THREE-ZONE SCREEN LAYOUT MATRIX */
    .master-universe-matrix {
      display: grid;
      grid-template-columns: 320px 1fr 320px;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
      align-items: flex-start;
    }

    /* Column Container Boxes */
    .panel-box { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
    .panel-title { font-weight: bold; font-size: 0.95rem; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 12px; color: #7a7aff; }

    /* --- 1. LEFT SIDE FLANK: PERSONAL DM PANEL --- */
    #left-dm-popup-panel { display: none; flex-direction: column; min-height: 480px; }
    .dm-side-select { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; font-weight: bold; background: #fafafa; }
    .dm-stream-logs { flex-grow: 1; border: 1px solid #f2f2f2; border-radius: 6px; background: #fbfbfb; padding: 10px; overflow-y: auto; height: 320px; display: flex; flex-direction: column; gap: 8px; }
    .bubble { max-width: 85%; padding: 8px 12px; border-radius: 14px; font-size: 0.85rem; line-height: 1.4; }
    .bubble.left { background: #efefef; color: black; align-self: flex-start; border-bottom-left-radius: 2px; }
    .bubble.right { background: #CCCCFF; color: #333366; align-self: flex-end; border-bottom-right-radius: 2px; }

    /* --- 2. CENTER ZONE: HOME TIMELINE TIMELINE FEED --- */
    .center-feed-stream { max-height: 800px; overflow-y: auto; padding: 0 10px; }
    .post-item-card { border: 1px solid #dbdbdb; border-radius: 8px; margin-bottom: 25px; background: white; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .post-header { padding: 12px; font-weight: bold; border-bottom: 1px solid #f2f2f2; background: white; }
    .post-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; background: #eee; }
    .post-likes-row { padding: 12px 14px 2px 14px; font-size: 0.88rem; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .post-caption { padding: 4px 14px 14px 14px; font-size: 0.92rem; line-height: 1.4; }
    .comment-open-btn { display: block; width: 100%; text-align: center; padding: 12px; background: #fbfbfb; border: none; border-top: 1px solid #efefef; font-size: 0.85rem; font-weight: bold; color: #0095f6; cursor: pointer; }

    /* --- 3. RIGHT SIDE FLANK: NAVIGATION MENU BUTTONS & CONTROLS --- */
    .right-sidebar-stack { display: flex; flex-direction: column; gap: 20px; }
    .nav-btn-list { display: flex; flex-direction: column; gap: 8px; background: white; border: 1px solid #ddd; border-radius: 8px; padding: 12px; }
    .nav-link { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; background: white; cursor: pointer; font-weight: bold; color: #666; text-align: center; font-size: 0.88rem; transition: all 0.2s; }
    .nav-link.active { background: #CCCCFF; color: #333366; border-color: #CCCCFF; }
    
    .input-field { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 0.88rem; background: #fafafa; }
    .select-box { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; font-weight: bold; background: #fafafa; }
    .action-btn { width: 100%; padding: 12px; border: none; border-radius: 6px; color: #333366; font-weight: bold; cursor: pointer; font-size: 0.9rem; background: #CCCCFF; }
    .action-link { font-size: 0.72rem; color: #0095f6; cursor: pointer; font-weight: bold; }

    /* Profiles Mini Hub view */
    .hub-header { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; border-bottom: 1px dashed #eee; padding-bottom: 10px; }
    .hub-avatar { width: 44px; height: 44px; border-radius: 50%; background: #CCCCFF; color: #333366; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .hub-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
    .hub-grid-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 4px; }

    /* 📌 OVER-THE-TOP INSTAGRAM OVERLAY POPUP MODAL WINDOW */
    .popup-overlay-backdrop { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 3000; justify-content: center; align-items: center; }
    .popup-modal-window { background: white; width: 90%; max-width: 500px; border-radius: 12px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    .modal-scroll-area { max-height: 260px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #eee; border-radius: 6px; padding: 10px; background: #fbfbfb; }
    .comment-item-card { border-bottom: 1px solid #f2f2f2; padding: 8px 0; font-size: 0.88rem; }
    .comment-actions-row { font-size: 0.75rem; color: #8e8e8e; font-weight: bold; margin-top: 4px; display: flex; gap: 10px; }
    .reply-nested-box { margin-left: 20px; padding-left: 10px; border-left: 2px solid #efefef; margin-top: 4px; display: flex; flex-direction: column; gap: 3px; }
  </style>
</head>
<body>

  <h1>✨ Coffee Shop AU Universe Matrix</h1>

  <!-- MASTER SIDE-BY-SIDE FRAME APPARATUS -->
  <main class="master-universe-matrix">

    <!-- ZONE A: LEFT POP-UP SIDE COLUMN (Triggers to open/slide cleanly when DMs tab is clicked) -->
    <div class="panel-box dm-column-interface" id="left-dm-popup-panel">
      <div class="panel-title">💬 Private Direct Messages</div>
      <label style="font-size:0.72rem; font-weight:bold; color:#666;">Chatting With Contact:</label>
      <select id="dm-recipient-selector" class="dm-side-select" onchange="switchPrivateChatThread(this.value)">
        <option value="Coffee_Shop_Hero">⚔️ @Coffee_Shop_Hero</option>
        <option value="Barista_Arin">☕ @Barista_Arin</option>
        <option value="Grumpy_Regular">📖 @Grumpy_Regular</option>
        <option value="Chai_Enthusiast">✨ @Chai_Enthusiast</option>
      </select>
      
      <div id="dm-log-viewport" class="dm-stream-viewport dm-stream-logs"></div>
      
      <div style="margin-top:10px; display:flex; gap:4px;">
        <input type="text" id="dm-typed-input" class="input-field" placeholder="Type DM text line..." style="margin:0; padding:6px;">
        <button style="background:#7a7aff; border:none; padding:0 12px; color:white; font-weight:bold; border-radius:4px; cursor:pointer;" onclick="submitPrivateDMMessage()">Send</button>
      </div>
    </div>

    <!-- ZONE B: CENTRAL STANDALONE FEED WINDOW (Always clear and unobstructed in the middle) -->
    <div class="center-feed-stream" id="feed-column-list">
      <!-- Renders card entries dynamically below -->
    </div>

    <!-- ZONE C: RIGHT SIDE FLANK PANEL (Houses all your active switches and navigation buttons) -->
    <div class="right-sidebar-stack">
      
      <!-- Right Side Tab Button Menu Rack -->
      <div class="nav-btn-list">
        <div style="font-size: 0.75rem; font-weight: bold; color: #8e8e8e; margin-bottom: 4px; text-align: center;">NAVIGATION HUB</div>
        <button id="btn-feed" class="nav-link active" onclick="clickNavigationRoute('feed')">📷 Home Feed</button>
        <button id="btn-dms" class="nav-link" onclick="clickNavigationRoute('dms')">💬 Personal DMs</button>
        <button id="btn-hub" class="nav-link" onclick="clickNavigationRoute('hub')">👤 Profiles Page</button>
        <button id="btn-studio" class="nav-link" style="color:#7a7aff;" onclick="clickNavigationRoute('studio')">⚙️ Creator Studio</button>
      </div>

      <!-- Account login manager card -->
      <div class="panel-box">
        <div class="panel-title">👤 Active Account Manager</div>
        <label style="font-size:0.75rem; font-weight:bold; color:#666;">Control Profile Character:</label>
        <select id="actor-selector" class="select-box" onchange="swapActiveGlobalActor(this.value)">
          <option value="Barista_Arin">☕ @Barista_Arin</option>
          <option value="Coffee_Shop_Hero">⚔️ @Coffee_Shop_Hero</option>
          <option value="Grumpy_Regular">📖 @Grumpy_Regular</option>
          <option value="Chai_Enthusiast">✨ @Chai_Enthusiast</option>
        </select>
      </div>

      <!-- Creator studio panel slider -->
      <div class="panel-box" id="sidebar-studio-panel" style="display: none;">
        <div class="panel-title">⚙️ Creator Studio</div>
        <input type="text" id="studio-image-url" class="input-field" placeholder="Paste image web URL link address...">
        <input type="text" id="studio-caption" class="input-field" placeholder="Type post caption text...">
        <input type="number" id="studio-likes" class="input-field" value="24" placeholder="Likes starting count...">
        <button class="action-btn" onclick="publishNewStudioPostCard()">Publish Post Card to Feed</button>
      </div>

      <!-- Profile Hub bio catalog drawer -->
      <div class="panel-box" id="sidebar-profiles-panel" style="display: none;">
        <div class="panel-title">👤 Profile Page Summary</div>
        <select id="hub-selector" class="select-box" onchange="renderHubProfileDossier(this.value)">
          <option value="Barista_Arin">@Barista_Arin</option>
          <option value="Coffee_Shop_Hero">@Coffee_Shop_Hero</option>
          <option value="Grumpy_Regular">@Grumpy_Regular</option>
          <option value="Chai_Enthusiast">@Chai_Enthusiast</option>
        </select>
        <div id="hub-profile-viewport-box"></div>
