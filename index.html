<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Shop AU Hub</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafafa; margin: 0; padding: 20px; color: #262626; }
    h1 { text-align: center; color: #ff8a00; margin-bottom: 5px; }
    .sub { text-align: center; color: #8e8e8e; font-size: 0.9rem; margin-bottom: 20px; }
    
    /* Navigation Bar */
    .tabs { display: flex; max-width: 600px; margin: 0 auto 20px auto; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; background: white; }
    .tab { flex: 1; padding: 14px; background: white; border: none; cursor: pointer; font-weight: bold; color: #8e8e8e; text-align: center; font-size: 0.85rem; }
    .tab.active { background: #ff8a00; color: white; }

    /* Actor Switcher Card */
    .profile-card { max-width: 600px; margin: 0 auto 20px auto; background: white; border: 1px solid #ddd; padding: 15px; border-radius: 8px; display: flex; gap: 15px; align-items: center; }
    .avatar { width: 50px; height: 50px; border-radius: 50%; background: #ff8a00; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.1rem; }
    .select-box { padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-weight: bold; background: #fafafa; }

    /* Main Display Windows */
    .window { max-width: 600px; margin: 0 auto; background: white; border: 1px solid #ddd; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
    .input-field { width: 100%; padding: 11px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 0.95rem; }

    /* Post Cards */
    .post-item { border: 1px solid #dbdbdb; padding: 0; border-radius: 8px; margin-top: 20px; background: white; overflow: hidden; }
    .post-header { padding: 12px; font-weight: bold; border-bottom: 1px solid #f2f2f2; }
    .post-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; background: #eee; }
    .post-likes { padding: 10px 14px 0 14px; font-size: 0.9rem; font-weight: bold; }
    .post-caption { padding: 10px 14px 14px 14px; font-size: 0.95rem; border-bottom: 1px solid #f2f2f2; }
    
    /* Comments */
    .comment-area { padding: 12px; background: #fbfbfb; }
    .comment-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .comment-row { font-size: 0.88rem; display: flex; justify-content: space-between; align-items: center; }
    .comment-edit-btn { font-size: 0.75rem; color: #0095f6; cursor: pointer; font-weight: bold; margin-left: 10px; }

    /* DM Matrix Layout */
    .dm-box { display: flex; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; min-height: 380px; }
    .dm-sidebar { width: 35%; border-right: 1px solid #ddd; background: #f9f9f9; }
    .dm-side-btn { width: 100%; padding: 12px 10px; border: none; border-bottom: 1px solid #ddd; background: none; text-align: left; font-weight: bold; cursor: pointer; }
    .dm-side-btn.active { background: #fff0e0; color: #ff8a00; }
    .dm-chat-view { width: 65%; display: flex; flex-direction: column; padding: 10px; background: #fbfbfb; }
    .dm-stream { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; max-height: 280px; }
    .bubble-row { display: flex; flex-direction: column; width: 100%; }
    .bubble { max-width: 85%; padding: 8px 12px; border-radius: 14px; font-size: 0.85rem; line-height: 1.4; }
    .bubble.left { background: #efefef; color: black; align-self: flex-start; border-bottom-left-radius: 4px; }
    .bubble.right { background: #ff8a00; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .bubble-meta { font-size: 0.7rem; font-weight: bold; color: #8e8e8e; margin-bottom: 2px; }

    /* Profile Hub UI Dossier */
    .hub-header { display: flex; gap: 15px; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 15px; }
    .hub-avatar { width: 60px; height: 60px; border-radius: 50%; background: #ff8a00; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.3rem; }
    .hub-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .hub-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 4px; }
  </style>
</head>

    <input type="text" id="studio-caption" class="input-field" placeholder="Type caption description box lore...">
    <input type="number" id="studio-likes" class="input-field" value="24" placeholder="Likes quantity...">
    <button class="btn" style="background:#ff8a00;" onclick="publishStudioPost()">Publish Post to Timeline</button>
  </div>
