<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Shop AU</title>
  <style>
    body { font-family: sans-serif; background: #fafafa; padding: 20px; text-align: center; }
    h1 { color: #ff8a00; }
    .tabs { display: flex; max-width: 400px; margin: 20px auto; border: 1px solid #ddd; border-radius: 5px; overflow: hidden; }
    .tab { flex: 1; padding: 10px; background: white; border: none; cursor: pointer; font-weight: bold; color: #8e8e8e; }
    .tab.active { background: #ff8a00; color: white; }
    .window { max-width: 400px; margin: 20px auto; background: white; border: 1px solid #ddd; padding: 20px; border-radius: 5px; min-height: 100px; }
  </style>
</head>
<body>

  <h1>✨ Coffee Shop AU Universe</h1>

  <div class="tabs">
    <button id="btn-feed" class="tab active" onclick="showPage('feed')">Feed</button>
    <button id="btn-dms" class="tab" onclick="showPage('dms')">DMs</button>
    <button id="btn-studio" class="tab" onclick="showPage('studio')">Studio</button>
  </div>

  <div id="win-feed" class="window">📷 [Feed View] Welcome to your timeline!</div>
  <div id="win-dms" class="window" style="display:none;">💬 [DMs View] Fictional chat message logs thread go here.</div>
  <div id="win-studio" class="window" style="display:none;">⚙️ [Studio View] Creator control workspace panel dashboard.</div>

  <script>
    function showPage(pageId) {
      document.getElementById('win-feed').style.display = (pageId === 'feed') ? 'block' : 'none';
      document.getElementById('win-dms').style.display = (pageId === 'dms') ? 'block' : 'none';
      document.getElementById('win-studio').style.display = (pageId === 'studio') ? 'block' : 'none';

      document.getElementById('btn-feed').className = 'tab' + (pageId === 'feed' ? ' active' : '');
      document.getElementById('btn-dms').className = 'tab' + (pageId === 'dms' ? ' active' : '');
      document.getElementById('btn-studio').className = 'tab' + (pageId === 'studio' ? ' active' : '');
    }
  </script>
</body>
</html>
