<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OC Social Network</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --purple: #a993d9;
  --purple-dark: #8065bd;
  --purple-light: #eee8fa;
  --blue: #0095f6;
  --background: #fafafa;
  --border: #dbdbdb;
  --text: #262626;
  --muted: #737373;
}

body {
  margin: 0;
  background: var(--background);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

/* =========================
   HEADER
========================= */

.topbar {
  height: 62px;
  background: white;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 25px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  color: var(--purple-dark);
  font-size: 1.35rem;
  font-weight: 800;
}

.topbar-actions {
  display: flex;
  gap: 8px;
}

.small-top-btn {
  border: none;
  background: var(--purple-light);
  color: var(--purple-dark);
  border-radius: 20px;
  padding: 8px 13px;
  cursor: pointer;
  font-weight: bold;
}

.small-top-btn:hover {
  background: #dfd4f2;
}

/* =========================
   MAIN LAYOUT
========================= */

.master-workspace-layout {
  display: grid;
  grid-template-columns: 300px minmax(400px, 1fr) 310px;
  gap: 20px;
  max-width: 1450px;
  margin: 25px auto;
  padding: 0 18px;
  align-items: start;
}

.panel-box {
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,.03);
}

.panel-title {
  font-weight: bold;
  font-size: .95rem;
  border-bottom: 1px solid #eee;
  padding-bottom: 9px;
  margin-bottom: 12px;
  color: var(--purple-dark);
}

/* =========================
   INPUTS / BUTTONS
========================= */

.input-field,
.select-box {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: white;
  font: inherit;
}

.action-btn {
  width: 100%;
  padding: 11px;
  border: none;
  border-radius: 7px;
  color: white;
  font-weight: bold;
  cursor: pointer;
  background: var(--purple);
  margin-bottom: 8px;
}

.action-btn:hover {
  background: var(--purple-dark);
}

.secondary-btn {
  background: #efefef;
  color: #333;
}

.secondary-btn:hover {
  background: #ddd;
}

.danger-btn {
  background: #e74c3c;
}

.danger-btn:hover {
  background: #c0392b;
}

/* =========================
   DM PANEL
========================= */

.dm-column-interface {
  height: 650px;
  display: flex;
  flex-direction: column;
}

.dm-stream-viewport {
  flex: 1;
  border: 1px solid #eee;
  border-radius: 8px;
  background: #fbfbfb;
  padding: 10px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.bubble {
  max-width: 85%;
  padding: 8px 12px;
  border-radius: 15px;
  font-size: .85rem;
  line-height: 1.4;
}

.bubble.left {
  background: #ededed;
  align-self: flex-start;
  border-bottom-left-radius: 3px;
}

.bubble.right {
  background: var(--purple);
  color: white;
  align-self: flex-end;
  border-bottom-right-radius: 3px;
}

/* =========================
   FEED
========================= */

.feed-column-interface {
  max-width: 600px;
  width: 100%;
  margin: auto;
}

.post-item-card {
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 20px;
  background: white;
  overflow: hidden;
}

.post-header {
  padding: 11px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.post-header-left {
  display: flex;
  align-items: center;
  gap: 9px;
}

.post-header-avatar {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  background: var(--purple);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: bold;
}

.post-header-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.post-author {
  font-weight: bold;
  font-size: .9rem;
}

.post-image-wrapper {
  width: 100%;
  height: 400px;
  background: #e9e1f5;
  position: relative;
  overflow: hidden;
}

.post-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.placeholder-image {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  color: var(--purple-dark);
  font-size: 3rem;
}

.post-actions {
  padding: 10px 14px 5px;
  display: flex;
  gap: 16px;
}

.post-action-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1.35rem;
  padding: 0;
}

.post-action-btn:hover {
  transform: scale(1.08);
}

.like-button.liked {
  color: #ed4956;
}

.post-likes {
  padding: 3px 14px;
  font-size: .88rem;
  font-weight: bold;
}

.post-caption {
  padding: 5px 14px 12px;
  line-height: 1
