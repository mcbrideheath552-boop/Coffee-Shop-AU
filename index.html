<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OC Social Universe</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #fafafa;
      color: #262626;
    }

    .app-header {
      background: #ffffff;
      border-bottom: 1px solid #dbdbdb;
      text-align: center;
      padding: 14px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .app-header h1 { margin: 0; font-size: 1.5rem; font-weight: 700; color: #ff8a00; }

    .instagram-container {
      max-width: 600px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .posts-feed {
      display: flex;
      flex-direction: column;
      gap: 35px;
    }

    .post-card {
      background: #ffffff;
      border: 1px solid #dbdbdb;
      border-radius: 8px;
      overflow: hidden;
    }

    .post-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }

    .post-content { padding: 16px; }
    .post-caption { margin: 0 0 16px 0; font-size: 0.95rem; line-height: 1.4; font-weight: 500; }

    .comments-section {
      border-top: 1px solid #efefef;
      padding-top: 12px;
      margin-top: 12px;
    }
    .comments-title { font-size: 0.85rem; font-weight: 600; color: #8e8e8e; margin-bottom: 8px; }
    .comment-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    
    .comment-item { font-size: 0.9rem; line-height: 1.3; }
    .comment-user { font-weight: 600; margin-right: 6px; color: #000000; }
    .comment-text { color: #333333; }

    .comment-form {
      display: flex;
      gap: 8px;
      border-top: 1px solid #efefef;
      padding-top: 12px;
    }
    .comment-select {
      padding: 8px;
      border: 1px solid #dbdbdb;
      border-radius: 4px;
      font-size: 0.85rem;
      background: #fff;
    }
    .comment-input {
      flex-grow: 1;
      padding: 8px 12px;
      border: 1px solid #dbdbdb;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .comment-btn {
      background: #0095f6;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .comment-btn:hover { background: #1877f2; }

    /* Admin Quick Post Addition Controls Box */
    .admin-box {
      background: #fff;
      border: 1px dashed #ff8a00;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 25px;
    }
    .admin-box h3 { margin: 0 0 10px 0; font-size: 1rem; color: #ff8a00; }
  </style>
</head>
<body>

  <header class="app-header">
    <h1>✨ Coffee Shop AU Universe</h1>
  </header>

  <main class="instagram-container">
    
    <!-- Visual Portal Box allowing rapid adding of posts straight from any screen screen -->
    <div class="admin-box">
      <h3>➕ Post to the Timeline as your Character</h3>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <input type="text" id="new-post-img" placeholder="Paste image link here (or leave blank for test cafe image)..." style="padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
        <input type="text" id="new-post-cap" placeholder="Type what your character writes in the description box..." style="padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
        <button onclick="createNewCharacterPost()" style="background:#ff8a00; color:white; border:none; padding:10px; border-radius:4px; font-weight:600; cursor:pointer;">Publish Post to Grid</button>
      </div>
    </div>

    <div id="posts-feed" class="posts-feed">
      <!-- Layout renders right here seamlessly -->
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBtdWNvYXZxbXF3Y2N2em1vdHdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MzE5MzQsImV4cCI6MjEwNTQwNzkzNH0.H4md913bLmWuRuIM00bBsYCasASLlIaJHoiIalar-Ns'; 

    // Initial Local Backup values to ensure your timeline runs instantly even if web networks fail
    const fallbackPosts = [
      { id: 1, image_url: "https://unsplash.com", caption: "Opening up the bakery counter early today. The cinnamon rolls just finished baking! ☕🥖" }
    ];
    const fallbackComments = [
      { post_id: 1, username: "Grumpy_Regular", comment_text: "Save two for me, Arin. Don't let the morning rush steal them." },
      { post_id: 1, username: "Chai_Enthusiast", comment_text: "Oh wow, those look incredible!! On my way right now!" }
    ];

    // Read stored sessions out of memory so it keeps your changes when you refresh your browser link
    let activePosts = JSON.parse(localStorage.getItem('oc_posts')) || fallbackPosts;
    let activeComments = JSON.parse(localStorage.getItem('oc_comments')) || fallbackComments;

    async function loadUniverseTimeline() {
      try {
        const postsRes = await fetch(`${SUPABASE_URL}/rest/v1/posts?select=id,image_url,caption,created_at&order=created_at.desc`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        if (!postsRes.ok) throw new Error("Blocked network handle");
        const cloudPosts = await postsRes.json();

        const commentsRes = await fetch(`${SUPABASE_URL}/rest/v1/comments?select=post_id,username,comment_text`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const cloudComments = await commentsRes.json();

        if(cloudPosts && cloudPosts.length > 0) activePosts = cloudPosts;
        if(cloudComments && cloudComments.length > 0) activeComments = cloudComments;
      } catch (error) {
        console.warn("Database network block detected by browser tracking suite. Safely launching local backup runtime engine configuration framework.");
      }
      
      renderTimelineLayout();
    }

    function renderTimelineLayout() {
      const feedContainer = document.getElementById('posts-feed');
      feedContainer.innerHTML = '';

      activePosts.forEach(post => {
        const postCard = document.createElement('div');
        postCard.className = 'post-card';

        const matchingComments = activeComments.filter(c => Number(c.post_id) === Number(post.id));
        let commentsHTML = '';
        matchingComments.forEach(c => {
          commentsHTML += `
            <div class="comment-item">
              <span class="comment-user">@${c.username}</span>
              <span class="comment-text">${c.comment_text}</span>
            </div>`;
        });

        postCard.innerHTML = `
          <img src="${post.image_url}" class="post-image" alt="OC Visual Snapshot Component Frame">
          <div class="post-content">
            <p class="post-caption">${post.caption || ''}</p>
            
            <div class="comments-section">
              <div class="comments-title">Comments Log</div>
              <div class="comment-list" id="comment-list-${post.id}">
                ${commentsHTML || '<p style="color:#b2b2b2; font-size:0.85rem; margin:0;" id="empty-comment-'+post.id+'">No entries yet. Write a character response below...</p>'}
              </div>
              
              <div class="comment-form">
                <select class="comment-select" id="user-select-${post.id}">
                  <option value="Barista_Arin">@Barista_Arin</option>
                  <option value="Coffee_Shop_Hero">@Coffee_Shop_Hero</option>
                  <option value="Grumpy_Regular">@Grumpy_Regular</option>
                  <option value="Chai_Enthusiast">@Chai_Enthusiast</option>
                </select>
                <input type="text" class="comment-input" id="input-${post.id}" placeholder="Write a comment as your character...">
                <button class="comment-btn" onclick="submitCharacterComment(${post.id})">Post</button>
              </div>
            </div>
          </div>
        `;
        feedContainer.appendChild(postCard);
      });
    }

    function createNewCharacterPost() {
      const imgInput = document.getElementById('new-post-img');
      const capInput = document.getElementById('new-post-cap');
      
      let imgUrl = imgInput.value.trim() || "https://unsplash.com";
      let captionText = capInput.value.trim() || "Stopped by the cafe window to watch the rain fall. 🌧️☕";

      const newPost = {
        id: Date.now(),
        image_url: imgUrl,
        caption: captionText
      };

      activePosts.unshift(newPost);
      localStorage.setItem('oc_posts', JSON.stringify(activePosts));
      
      // Attempt to backing upload to remote server if connections let up
      fetch(`${SUPABASE_URL}/rest/v1/posts`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ image_url: imgUrl, caption: captionText })
      }).catch(e => console.log('Local save logged successfully. Remote network skipped.'));

      imgInput.value = '';
      capInput.value = '';
      renderTimelineLayout();
    }

    async function submitCharacterComment(postId) {
      const selectBox = document.getElementById(`user-select-${postId}`);
      const inputBox = document.getElementById(`input-${postId}`);
      const chosenOC = selectBox.value;
      const commentTxt = inputBox.value.trim();

      if (!commentTxt) return;

      const newComment = { post_id: postId, username: chosenOC, comment_text: commentTxt };
      activeComments.push(newComment);
      localStorage.setItem('oc_comments', JSON.stringify(activeComments));
