<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OC Social Network</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --purple: #a993d9;
  --purple-dark: #8066b5;
  --purple-light: #eee8fa;
  --pink: #f3d7e8;
  --blue: #4d8fdc;
  --bg: #f7f5f9;
  --border: #dedbe3;
  --text: #26232a;
  --muted: #77727c;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

/* =========================
   HEADER
========================= */

.topbar {
  height: 64px;
  background: white;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 25px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  color: var(--purple-dark);
  font-size: 21px;
  font-weight: 800;
}

.topbar-user {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 700;
}

/* =========================
   MAIN LAYOUT
========================= */

.app {
  max-width: 1450px;
  margin: 0 auto;
  padding: 25px;
  display: grid;
  grid-template-columns: 300px minmax(400px, 600px) 300px;
  gap: 25px;
  align-items: start;
}

/* =========================
   PANELS
========================= */

.panel {
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 18px;
}

.panel-title {
  color: var(--purple-dark);
  font-weight: 800;
  font-size: 14px;
  padding-bottom: 11px;
  margin-bottom: 13px;
  border-bottom: 1px solid #eee;
}

/* =========================
   AVATARS
========================= */

.avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--purple);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
  font-weight: 800;
}

.avatar.large {
  width: 72px;
  height: 72px;
  font-size: 23px;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* =========================
   INPUTS
========================= */

input,
textarea,
select {
  width: 100%;
  border: 1px solid #d8d4dc;
  background: #fff;
  border-radius: 7px;
  padding: 10px;
  font: inherit;
  outline: none;
}

input:focus,
textarea:focus,
select:focus {
  border-color: var(--purple);
  box-shadow: 0 0 0 2px rgba(169,147,217,.15);
}

textarea {
  min-height: 90px;
  resize: vertical;
}

label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  margin: 10px 0 5px;
}

/* =========================
   BUTTONS
========================= */

button {
  font: inherit;
}

.btn {
  border: none;
  border-radius: 7px;
  padding: 9px 12px;
  cursor: pointer;
  font-weight: 700;
}

.btn-purple {
  background: var(--purple);
  color: white;
}

.btn-purple:hover {
  background: var(--purple-dark);
}

.btn-light {
  background: var(--purple-light);
  color: var(--purple-dark);
}

.btn-danger {
  background: #f5dddd;
  color: #a64040;
}

.btn-danger:hover {
  background: #edcaca;
}

.btn-full {
  width: 100%;
  margin-top: 9px;
}

.btn-small {
  padding: 6px 9px;
  font-size: 12px;
}

/* =========================
   PROFILE MINI
========================= */

.profile-mini {
  display: flex;
  align-items: center;
  gap: 10px;
}

.profile-name {
  font-weight: 800;
  font-size: 14px;
}

.profile-handle {
  color: var(--muted);
  font-size: 12px;
  margin-top: 2px;
}

.profile-bio {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.4;
  margin-top: 12px;
}

/* =========================
   DMS
========================= */

.dm-list {
  height: 280px;
  overflow-y: auto;
  background: #faf9fb;
  border: 1px solid #eee;
  border-radius: 8px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.message {
  max-width: 82%;
  padding: 8px 11px;
  border-radius: 14px;
  font-size: 13px;
  line-height: 1.35;
}

.message.them {
  align-self: flex-start;
  background: #eceaed;
  border-bottom-left-radius: 3px;
}

.message.me {
  align-self: flex-end;
  background: var(--purple);
  color: white;
  border-bottom-right-radius: 3px;
}

.dm-compose {
  display: flex;
  gap: 5px;
  margin-top: 9px;
}

.dm-compose input {
  min-width: 0;
}

/* =========================
   FEED
========================= */

.feed {
  min-width: 0;
}

.story-bar {
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 13px;
  margin-bottom: 18px;
  display: flex;
  gap: 15px;
  overflow-x: auto;
}

.story {
  min-width: 65px;
  text-align: center;
  font-size: 11px;
  color: var(--muted);
}

.story .avatar {
  margin: auto auto 5px;
  border: 3px solid #e7c8e5;
}

.feed-scroll {
  max-height: calc(100vh - 125px);
  overflow-y: auto;
  padding-right: 6px;
  scroll-behavior: smooth;
}

.post {
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 20px;
}

.post-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 14px;
}

.post-user {
  display: flex;
  align-items: center;
  gap: 9px;
}

.post-user-name {
  font-weight: 800;
  font-size: 14px;
}

.post-user-handle {
  color: var(--muted);
  font-size: 11px;
}

.post-menu {
  border: none;
  background: none;
  font-size: 20px;
  cursor: pointer;
  color: #777;
}

.post-menu:hover {
  color: var(--purple-dark);
}

.post-image {
  width: 100%;
  height: 420px;
  object-fit: cover;
  background: var(--purple-light);
  display: block;
}

.placeholder-image {
  width: 100%;
  height: 420px;
  background: linear-gradient(135deg, #e6def6, #f4dce8);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--purple-dark);
  font-size: 48px;
  font-weight: 900;
}

.post-actions {
  display: flex;
  gap: 17px;
  padding: 11px 14px 4px;
}

.icon-btn {
  border: none;
  background: none;
  cursor: pointer;
  padding: 0;
  font-size: 22px;
}

.like-button.liked {
  color: #df4771
